<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>मल-खाद व्यवस्थापन प्रणाली | Fertilizer Management System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.5/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg: #F6F4EC;
  --panel: #FFFFFF;
  --ink: #202A1E;
  --ink-soft: #5B6357;
  --forest: #2F5233;
  --forest-dark: #1E3A22;
  --gold: #C79A1E;
  --soil: #8B5E3C;
  --nepal-red: #C8203A;
  --line: #E4DFCF;
  --danger: #B23A2E;
  --ok: #2F7A45;
  --radius: 10px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Devanagari','Inter',sans-serif;}
::selection{background:var(--gold);color:#fff;}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 20% 20%, rgba(47,82,51,0.12), transparent 45%),
  radial-gradient(circle at 85% 80%, rgba(199,154,30,0.14), transparent 45%),
  var(--bg);
  padding:20px;}
.login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:0 20px 50px -20px rgba(30,58,34,0.25);}
.brand-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.brand-mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--forest),var(--forest-dark));display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:20px;flex-shrink:0;}
.brand-title{font-weight:800;font-size:18px;letter-spacing:0.2px;}
.brand-sub{font-size:12px;color:var(--ink-soft);margin:0 0 22px 48px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#FCFBF7;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--forest);outline-offset:1px;border-color:var(--forest);}
.btn{cursor:pointer;border:none;border-radius:8px;padding:11px 16px;font-weight:700;font-size:14px;font-family:inherit;transition:transform .05s ease, opacity .15s;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--forest);color:#fff;width:100%;}
.btn-primary:hover{background:var(--forest-dark);}
.btn-gold{background:var(--gold);color:#3a2c05;}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-danger{background:var(--danger);color:#fff;}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:14px;line-height:1.5;text-align:center;}
.err{background:#FBEAE8;color:var(--danger);border:1px solid #F0C9C4;padding:8px 10px;border-radius:7px;font-size:12.5px;margin-bottom:12px;}
.coop-pick-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:#FCFBF7;border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;font-family:inherit;transition:background .1s,border-color .1s;}
.coop-pick-btn:hover{background:#F1EEDF;border-color:var(--forest);}
.coop-pick-btn .nm{font-size:13px;font-weight:700;color:var(--ink);}
.coop-pick-btn .un{font-size:11px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}

/* ---------- app shell ---------- */
.app{min-height:100vh;display:flex;}
.sidebar{width:230px;background:var(--forest-dark);color:#EDEEE7;flex-shrink:0;display:flex;flex-direction:column;padding:18px 12px;}
.sb-brand{display:flex;align-items:center;gap:9px;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:12px;}
.sb-brand .mark{width:30px;height:30px;border-radius:7px;background:var(--gold);color:#3a2c05;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0;}
.sb-brand .txt{font-size:13.5px;font-weight:700;line-height:1.25;}
.sb-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;color:#D6D9CE;border:none;background:transparent;text-align:left;width:100%;font-family:inherit;}
.sb-item:hover{background:rgba(255,255,255,0.06);}
.sb-item.active{background:var(--gold);color:#3a2c05;}
.sb-icon{width:18px;text-align:center;}
.sb-foot{border-top:1px solid rgba(255,255,255,0.12);padding-top:12px;font-size:11.5px;color:#AEB4A5;}
.sb-user{font-size:12.5px;font-weight:700;color:#fff;margin-bottom:2px;}
.sb-logout{margin-top:8px;width:100%;}

.main{flex:1;min-width:0;}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
.topbar h1{font-size:17px;margin:0;font-weight:800;}
.topbar .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.lang-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.lang-toggle button{border:none;background:#fff;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink-soft);}
.lang-toggle button.on{background:var(--forest);color:#fff;}
.lang-toggle select{border:none;background:#fff;padding:7px 10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
body.a11y{font-size:118%;}
body.a11y .btn, body.a11y button{min-height:44px;}
body.a11y.hc{background:#fff;color:#000;}
body.a11y.hc .panel, body.a11y.hc .sidebar, body.a11y.hc .topbar, body.a11y.hc .login-card{background:#fff;border-color:#000;}
body.a11y.hc .sb-item.active{background:#000;color:#fff;}
body.a11y.hc, body.a11y.hc *{color:#000 !important;}
body.a11y.hc a, body.a11y.hc .btn-primary{color:#fff !important;}
body.a11y.hc .btn-primary, body.a11y.hc .sb-item.active{background:#000 !important;}
.a11y-toggle-row{display:flex;gap:8px;align-items:center;}
.a11y-toggle-row button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink-soft);}
.a11y-toggle-row button.on{background:var(--forest);color:#fff;border-color:var(--forest);}
.content{padding:22px 26px 60px;max-width:1180px;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:18px;}
.panel h2{font-size:15px;margin:0 0 4px;font-weight:800;}
.panel .desc{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media (max-width:720px){.grid3{grid-template-columns:1fr;}}

.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;}
.stat .n{font-size:24px;font-weight:800;font-family:'JetBrains Mono',monospace;}
.stat .l{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:2px;}
.stat .tag{position:absolute;top:14px;right:14px;font-size:16px;opacity:0.5;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:0.3px;color:var(--ink-soft);border-bottom:2px solid var(--line);padding:8px 10px;font-weight:700;}
td{padding:9px 10px;border-bottom:1px solid var(--line);}
tr:hover td{background:#FBFAF5;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-cash{background:#FDF1D9;color:#8A6103;}
.badge-bank{background:#E4EEF7;color:#1E5A8A;}
.badge-subsidy{background:#E4F1E6;color:var(--ok);}
.badge-full{background:#F1E4E9;color:var(--soil);}

.photo-box{width:100%;aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#FCFBF7;cursor:pointer;position:relative;}
.photo-box img{width:100%;height:100%;object-fit:cover;}
.photo-box .ph{font-size:11px;color:var(--ink-soft);text-align:center;padding:8px;}
.photo-box input{position:absolute;inset:0;opacity:0;cursor:pointer;}

.idcard{width:320px;height:238px;border-radius:12px;background:linear-gradient(135deg,#fff 60%,#F6F4EC 100%);border:1px solid var(--line);position:relative;overflow:hidden;padding:10px 12px;display:flex;flex-direction:column;box-shadow:0 6px 16px -8px rgba(0,0,0,0.25);}
.idcard .strip{position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--forest),var(--gold),var(--nepal-red));}
.idcard .hd{display:flex;align-items:center;gap:6px;margin-top:6px;}
.idcard .hd .m{width:20px;height:20px;border-radius:5px;background:var(--forest);color:var(--gold);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.idcard .hd .t{font-size:9.5px;font-weight:800;line-height:1.1;}
.idcard .body{display:flex;gap:10px;flex:1;margin-top:8px;}
.idcard .photo{width:60px;height:70px;border-radius:6px;overflow:hidden;background:#eee;flex-shrink:0;border:1px solid var(--line);}
.idcard .photo img{width:100%;height:100%;object-fit:cover;}
.idcard .info{font-size:9.8px;line-height:1.42;flex:1;min-width:0;}
.idcard .info b{font-size:11.5px;display:block;}
.idcard .info .id{font-family:'JetBrains Mono',monospace;color:var(--forest);font-weight:700;}
.idcard .info .addr{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.idcard .codesrow{display:flex;align-items:center;gap:8px;margin-top:6px;}
.idcard .bcwrap{flex:1;text-align:center;}
.idcard .bcwrap svg{width:100%;height:30px;}
.idcard .qrwrap{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.idcard .qrwrap img,.idcard .qrwrap canvas{width:44px!important;height:44px!important;}
.idcard .sigrow{display:flex;justify-content:flex-end;align-items:flex-end;margin-top:4px;}
.idcard .sigbox{text-align:center;width:120px;}
.idcard .sigbox .line{border-top:1px solid var(--ink-soft);margin-bottom:2px;height:14px;}
.idcard .sigbox .lbl{font-size:7.5px;color:var(--ink-soft);font-weight:600;}

.a4sheet{background:#fff;width:210mm;min-height:297mm;margin:0 auto;padding:10mm;display:grid;grid-template-columns:repeat(2,1fr);gap:6mm;justify-items:center;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;left:0;top:0;}
  .sidebar,.topbar{display:none!important;}
}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:8px 14px;font-size:13px;font-weight:700;border:none;background:transparent;cursor:pointer;color:var(--ink-soft);border-bottom:2px solid transparent;font-family:inherit;}
.tab.on{color:var(--forest);border-bottom-color:var(--forest);}

.empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
.empty .ic{font-size:34px;margin-bottom:8px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--forest-dark);color:#fff;padding:12px 18px;border-radius:9px;font-size:13px;font-weight:600;z-index:50;box-shadow:0 10px 30px -10px rgba(0,0,0,0.4);}
.row-actions button{border:none;background:transparent;cursor:pointer;font-size:13px;color:var(--forest);font-weight:700;}
.small-note{font-size:11px;color:var(--ink-soft);background:#FBFAF5;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;}
.select-coop{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;}

/* ---------- coop registration info card (dashboard) ---------- */
.coop-info-card{background:linear-gradient(135deg,var(--forest-dark),var(--forest));color:#fff;border-radius:14px;padding:18px 22px;margin-bottom:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.coop-info-card .logo{width:52px;height:52px;border-radius:10px;object-fit:cover;background:rgba(255,255,255,0.15);flex-shrink:0;}
.coop-info-card .logo-ph{width:52px;height:52px;border-radius:10px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.coop-info-card .nm{font-size:17px;font-weight:800;}
.coop-info-card .metarow{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px;font-size:12px;color:rgba(255,255,255,0.85);}
.coop-info-card .metarow b{color:#fff;font-weight:700;}

/* ---------- Nepali (BS) date field ---------- */
.bs-date-field{display:flex;gap:6px;}
.bs-date-field select{flex:1;min-width:0;padding:10px 8px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;background:#FCFBF7;color:var(--ink);}
.bs-date-field select:focus{outline:2px solid var(--forest);outline-offset:1px;border-color:var(--forest);}
.clock-box{display:flex;align-items:center;gap:10px;background:#FBFAF5;border:1px solid var(--line);border-radius:9px;padding:7px 14px;}
.clock-box .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s ease-in-out infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
.clock-box .cd{font-size:12px;font-weight:700;color:var(--ink);}
.clock-box .ct{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:800;color:var(--forest);letter-spacing:0.4px;}
.clock-box .cl{font-size:10px;color:var(--ink-soft);font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}

.req{color:var(--nepal-red);margin-left:2px;}
.subfields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.check-row{display:flex;align-items:center;gap:8px;margin:10px 0;}
.check-row input{width:16px;height:16px;}
.map-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;height:230px;}
.map-note{font-size:11.5px;color:var(--ink-soft);margin-top:6px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
.map-note a{color:var(--forest);font-weight:700;text-decoration:none;}
.map-mode-row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.map-mode-btn{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#FCFBF7;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink-soft);}
.map-mode-btn.on{background:var(--forest);border-color:var(--forest);color:#fff;}
.map-area-box{margin-top:8px;padding:10px 12px;border-radius:9px;background:#F1EEDF;border:1px solid var(--line);font-size:12.5px;}
.map-area-box .big{font-size:15px;font-weight:800;color:var(--forest-dark);}
.map-hint{font-size:11px;color:var(--ink-soft);margin:6px 0;}
.doc-box{width:100%;min-height:110px;border:1.5px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#FCFBF7;cursor:pointer;position:relative;flex-direction:column;gap:6px;padding:10px;}
.doc-box img{max-width:100%;max-height:100px;object-fit:cover;border-radius:6px;}
.doc-box .pdf-chip{background:var(--danger);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:5px;}
.doc-box .ph{font-size:11px;color:var(--ink-soft);text-align:center;}
.doc-box input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.need-row{display:grid;grid-template-columns:1fr 90px 100px 34px;gap:8px;align-items:center;margin-bottom:8px;}
.need-add{background:transparent;border:1px dashed var(--forest);color:var(--forest);border-radius:8px;padding:8px 12px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;}
.need-del{background:#FBEAE8;color:var(--danger);border:none;border-radius:7px;width:34px;height:34px;cursor:pointer;font-weight:800;font-size:15px;}
.chip{display:inline-block;background:#EFF4EA;color:var(--forest-dark);border:1px solid #DCE7D3;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:700;margin:2px 3px 0 0;}
.fy-select{padding:7px 11px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:12.5px;font-weight:700;background:#fff;color:var(--forest);}
.fy-chip{display:inline-flex;align-items:center;gap:6px;background:#FBFAF5;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:700;margin:3px 4px 0 0;}
.fy-chip.current{background:var(--forest);color:#fff;border-color:var(--forest);}
.export-btn{background:#E4F1E6;color:var(--ok);border:1px solid #CBE4CE;border-radius:8px;padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
.export-btn:hover{background:#D8ECDB;}
</style>
</head>
<body>
<div id="root"></div>

<script>
const T = {
  np: {
    appName:"मल-खाद व्यवस्थापन प्रणाली", appSub:"सहकारी संस्थाहरूको लागि",
    login:"लगइन गर्नुहोस्", username:"प्रयोगकर्ता नाम", password:"पासवर्ड",
    loginBtn:"लगइन", noAccountHint:"खाता छैन? तल थिचेर नयाँ सहकारी दर्ता गर्नुहोस्।",
    createAccount:"नयाँ सहकारी खाता बनाउनुहोस्", coopName:"सहकारीको नाम", createBtn:"खाता बनाउनुहोस् र लगइन गर्नुहोस्",
    // ---- पालिका (मुख्य प्रयोगकर्ता) र सहकारी (सहायक प्रयोगकर्ता) तह ----
    selectAccountType:"खाताको किसिम छान्नुहोस्", accountTypePalika:"🏛️ पालिका (मुख्य प्रयोगकर्ता)", accountTypeSahakari:"🌾 सहकारी (पालिका मातहतको सहायक प्रयोगकर्ता)",
    accountTypeNote:"पालिका खाताले आफू मातहतका सबै सहकारीको बिक्री/वितरण एकैचोटि हेर्न सक्छ। सहकारी खाताले चाहिं आफ्नो पालिका छानेर मातहत बस्नुपर्छ।",
    parentPalika:"मातहत रहने पालिका", selectParentPalika:"पालिका छान्नुहोस्", noPalikaYet:"अझै कुनै पालिका (मुख्य प्रयोगकर्ता) खाता खोलिएको छैन — पहिले पालिका खाता खोल्नुहोस्।",
    mainUserBadge:"मुख्य प्रयोगकर्ता (पालिका)", subUserBadge:"सहायक प्रयोगकर्ता (सहकारी)",

function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if(k==='html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c=>{
    if(c===null||c===undefined) return;
    if(typeof c==='string'||typeof c==='number') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

/* ---------- storage layer ----------
   Prefers Claude.ai's built-in window.storage (multi-device, shared across
   users of the artifact). When that API isn't present — e.g. the file was
   downloaded and opened directly in a normal browser outside Claude.ai —
   everything transparently falls back to the browser's own localStorage so
   the app still works fully standalone (data then stays on that one
   browser/device only). LS_PREFIX keeps our keys from colliding with
   anything else stored in that browser. */
const HAS_CLOUD_STORAGE = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');
const LS_PREFIX = 'fms:';

async function safeGet(key, shared){
  if(HAS_CLOUD_STORAGE){
    try{
      const r = await window.storage.get(key, shared);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ /* fall through to localStorage */ }
  }
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function safeSet(key, value, shared){
  if(HAS_CLOUD_STORAGE){
    try{
      await window.storage.set(key, JSON.stringify(value), shared);
      removeFromOfflineQueue(key, shared);
      return true;
    }catch(e){
      console.error('cloud storage set failed, falling back to localStorage', e);
      queueForOfflineSync(key, shared);
    }
  }
  try{
    localStorage.setItem(LS_PREFIX+key, JSON.stringify(value));
    return true;
  }catch(e){
    console.error('storage set failed', e);
    showToast(STATE.lang!=='en' ? '⚠️ डाटा सुरक्षित गर्न सकिएन, फेरि प्रयास गर्नुहोस्' : '⚠️ Could not save data, please try again');
    return false;
  }
}

/* ---------- अफलाइन मोड ----------
   window.storage.set failing (typically because the device is offline) is
   caught above and already falls back to saving in this browser's own
   localStorage, so no work is lost in the moment. What's added here is the
   other half: remembering *which* keys fell back, so that once the
   connection returns we can push those exact keys' latest local values back
   up to window.storage — without that, changes made while offline would
   stay stuck on this one device even after reconnecting. */
let offlineQueue = []; // [{key, shared}], deduplicated by key+shared

function queueForOfflineSync(key, shared){
  if(!offlineQueue.some(q=>q.key===key && q.shared===shared)){
    offlineQueue.push({key, shared});
  }
  STATE.isOnline = (typeof navigator!=='undefined') ? navigator.onLine : true;
  render();
}
function removeFromOfflineQueue(key, shared){
  offlineQueue = offlineQueue.filter(q=>!(q.key===key && q.shared===shared));
}
async function syncOfflineQueue(){
  if(!HAS_CLOUD_STORAGE || offlineQueue.length===0) return;
  const toSync = [...offlineQueue];
  for(const q of toSync){
    try{
      const raw = localStorage.getItem(LS_PREFIX+q.key);
      if(raw==null) { removeFromOfflineQueue(q.key, q.shared); continue; }
      await window.storage.set(q.key, raw, q.shared);
      removeFromOfflineQueue(q.key, q.shared);
    }catch(e){ /* still offline or failing — stays queued, will retry */ }
  }
  if(offlineQueue.length===0) showToast(t('syncedMsg'));
  render();
}
if(typeof window !== 'undefined'){
  window.addEventListener('online', ()=>{ STATE.isOnline = true; showToast(t('backOnlineMsg')); syncOfflineQueue(); render(); });
  window.addEventListener('offline', ()=>{ STATE.isOnline = false; render(); });
  setInterval(()=>{ if(navigator.onLine && offlineQueue.length>0) syncOfflineQueue(); }, 30000);
}

// खरिद (स्टक-इन) भएपिच्छे: यही मलको वार्षिक कोटा भएका किसानहरूलाई स्वतः 'SMS सूचना' (डेमो लग) पठाउँछ
async function generateStockArrivalSms(items){
  const itemNames = [...new Set((items||[]).map(it=>it.itemName.trim().toLowerCase()).filter(Boolean))];
  if(itemNames.length===0) return;
  const newEntries = [];
  STATE.farmers.forEach(f=>{
    const needsThisFy = (f.annualNeeds||[]).filter(n=>(n.fiscalYear||STATE.currentFiscalYear)===STATE.currentFiscalYear);
    const matched = needsThisFy.find(n=> itemNames.includes(n.item.trim().toLowerCase()));
    if(!matched || !f.phone) return;
    newEntries.push({
      id: genId('SMS'),
      farmerId: f.id, farmerName: f.name, phone: f.phone, item: matched.item,
      message: (STATE.lang!=='en'
        ? ('तपाईंको वडा नं. '+(f.wardNo||'-')+'मा '+matched.item+' मल आइपुगेको छ। आफ्नो किसान कार्ड लिएर सहकारीमा आउनुहोला। — '+STATE.user.coopName)
        : ('Fertilizer ('+matched.item+') has arrived for Ward '+(f.wardNo||'-')+'. Please bring your farmer card to the cooperative. — '+STATE.user.coopName)),
      sentAt: new Date().toISOString(),
    });
  });
  if(newEntries.length===0) return;
  STATE.smsLog = newEntries.concat(STATE.smsLog);
  await safeSet(tKey('smsLog'), STATE.smsLog, true);
  showToast(t('smsSentBanner').replace('{n}', newEntries.length));
}

/* ---------- राष्ट्रिय (national) डुप्लिकेट-रोकथाम अभिलेख ----------
   Every farmer citizenship number is checked/registered against ONE shared
   registry key across ALL cooperatives/municipalities using this artifact —
   so the same farmer can't quietly collect subsidized fertilizer twice from
   two different local bodies. Keyed by citizenship number (not by coop),
   which is what makes the check nationwide instead of per-tenant. */
function natRegKey(citizenshipNo){
  return 'natreg:' + citizenshipNo.trim().replace(/\s+/g,'').toUpperCase();
}
async function checkNationalDuplicate(citizenshipNo, ownFarmerId){
  if(!citizenshipNo || !citizenshipNo.trim()) return null;
  try{
    const rec = await safeGet(natRegKey(citizenshipNo), true);
    if(rec && rec.farmerId !== ownFarmerId) return rec;
    return null;
  }catch(e){ return null; }
}
async function registerNationalRecord(citizenshipNo, info){
  if(!citizenshipNo || !citizenshipNo.trim()) return;
  await safeSet(natRegKey(citizenshipNo), info, true);
}

async function triggerWebhook(eventType, data){

  const payload = {event:eventType, coopId:STATE.user.coopId, coopName:STATE.user.coopName, data, at:new Date().toISOString()};

    await fetch(STATE.webhookConfig.url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});

  STATE.webhookConfig.log = [{...payload, status}, ...(STATE.webhookConfig.log||[])].slice(0,20);
  await safeSet(tKey('webhookConfig'), STATE.webhookConfig, true);
}

   here, the same cross-tenant read pattern the government dashboard uses,
   just pre-scoped to this palika's own children and needing no access code
   since the palika already owns the relationship. */
async function loadMonitoringData(){

function toNepaliNum(n){
  return String(n).split('').map(ch => (ch>='0'&&ch<='9') ? NEPALI_DIGITS[+ch] : ch).join('');
}
function bsMonthDaysCountFromMinYear(bsMonth, yearDiff){
  if(yearDiff===0) return 0;
  let yearCount=0, days=0;
  const arr = BS_MONTH_DATA[bsMonth-1];
  for(let i=0;i<arr.length;i++){
    if(arr[i]===0) continue;
    const idx = i%2;
    if(!(yearDiff > yearCount+arr[i])){
      days += BS_MONTH_UPPER_DAYS[bsMonth-1][idx]*(yearDiff-yearCount);
      yearCount = yearDiff-yearCount;
      break;
    }
    yearCount += arr[i];
    days += BS_MONTH_UPPER_DAYS[bsMonth-1][idx]*arr[i];
  }
  return days;
}
function bsGetMonthDays(bsYear, bsMonth){
  let yearCount=0;
  const totalYears = bsYear+1-BS_MIN_YEAR;
  const arr = BS_MONTH_DATA[bsMonth-1];
  for(let i=0;i<arr.length;i++){
    if(arr[i]===0) continue;
    const idx = i%2;
    yearCount += arr[i];
    if(totalYears <= yearCount){
      if((bsYear===2085 && bsMonth===5) || (bsYear===2088 && bsMonth===5)) return BS_MONTH_UPPER_DAYS[bsMonth-1][idx]-2;
      if(bsYear===2081 && bsMonth===2) return BS_MONTH_UPPER_DAYS[bsMonth-1][idx+1];
      if(bsYear===2081 && bsMonth===3) return BS_MONTH_UPPER_DAYS[bsMonth-1][idx-1];
      if(bsYear===2081 && bsMonth===11) return BS_MONTH_UPPER_DAYS[bsMonth-1][idx]-1;
      if(bsYear===2081 && bsMonth===12) return BS_MONTH_UPPER_DAYS[bsMonth-1][idx]+1;
      return BS_MONTH_UPPER_DAYS[bsMonth-1][idx];
    }
  }
  return null;
}
function bsTotalDaysFromMinYear(bsYear, bsMonth, bsDate){
  if(bsYear<BS_MIN_YEAR || bsYear>BS_MAX_YEAR) return null;
  const diffYears = bsYear-BS_MIN_YEAR;
  let days=0;
  for(let month=1;month<=12;month++){
    days += month<bsMonth ? bsMonthDaysCountFromMinYear(month, diffYears+1) : bsMonthDaysCountFromMinYear(month, diffYears);
  }
  if(bsYear>2085 && bsYear<2088) days += bsDate-2;
  else if(bsYear===2085 && bsMonth>5) days += bsDate-2;
  else if(bsYear===2081 && bsMonth===3) days += bsDate+1;
  else if(bsYear===2081 && bsMonth===12) days += bsDate-1;
  else if(bsYear>2088) days += bsDate-4;
  else if(bsYear===2088 && bsMonth>5) days += bsDate-4;
  else days += bsDate;
  return days;
}
function bsToAdDate(bsYear, bsMonth, bsDate){
  const daysNum = bsTotalDaysFromMinYear(bsYear, bsMonth, bsDate);
  if(daysNum===null) return null;
  const ad = new Date(BS_REF_AD.year, BS_REF_AD.month, BS_REF_AD.date-1);
  ad.setDate(ad.getDate()+daysNum);
  return ad;
}
function adToBs(adDate){
  const adYear = adDate.getFullYear(), adMonth = adDate.getMonth()+1, adDay = adDate.getDate();
  if(adYear < BS_MIN_YEAR-57 || adYear > BS_MAX_YEAR-57) return null;
  let bsYear = adYear+57;
  let bsMonth = (adMonth+9)%12; bsMonth = bsMonth===0?12:bsMonth;
  let bsDate = 1;
  if(adMonth<4) bsYear -= 1;
  else if(adMonth===4){
    const bsYearFirstAdDate = bsToAdDate(bsYear,1,1);
    if(bsYearFirstAdDate && adDay < bsYearFirstAdDate.getDate()) bsYear -= 1;
  }
  const bsMonthFirstAdDate = bsToAdDate(bsYear, bsMonth, 1);
  if(!bsMonthFirstAdDate) return null;
  if(adDay>=1 && adDay<bsMonthFirstAdDate.getDate()){
    bsMonth = bsMonth!==1 ? bsMonth-1 : 12;
    const bsMonthDays = bsGetMonthDays(bsYear, bsMonth);
    bsDate = bsMonthDays - (bsMonthFirstAdDate.getDate()-adDay) + 1;
  } else {
    bsDate = adDay - bsMonthFirstAdDate.getDate() + 1;
  }
  return {bsYear, bsMonth, bsDate};
}
function fmtDate(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '-';
  const bs = adToBs(d);
  if(bs) return toNepaliNum(bs.bsDate) + ' ' + BS_MONTHS_NP[bs.bsMonth-1] + ', ' + toNepaliNum(bs.bsYear);
  // fallback (outside supported BS range 1970-2100): show Gregorian
  return d.toLocaleDateString(STATE.lang!=='en'?'ne-NP':'en-US', {year:'numeric',month:'short',day:'numeric'});
}
function fmtTime(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleTimeString(STATE.lang!=='en'?'ne-NP':'en-US', {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
}

/* ---------- Nepali (BS) date entry field ----------
   Renders year/month/day <select> dropdowns for Bikram Sambat entry instead
   of the browser's native (Gregorian) date picker. Exposes a `.value`
   getter/setter that reads/writes an ISO (AD) yyyy-mm-dd string, so it's a
   drop-in replacement anywhere `el('input',{type:'date', ...})` was used —
   the rest of the app keeps storing/reading plain ISO date strings. */
function BsDateField(initialIso){
  const wrap = document.createElement('div');
  wrap.className = 'bs-date-field';

  const seedDate = (initialIso && !isNaN(new Date(initialIso).getTime())) ? new Date(initialIso) : new Date();
  let bs = adToBs(seedDate) || {bsYear:2082, bsMonth:1, bsDate:1};

  const yearSel = document.createElement('select');
  const monthSel = document.createElement('select');
  const daySel = document.createElement('select');

  for(let y=BS_MIN_YEAR; y<=BS_MAX_YEAR; y++){
    const opt = document.createElement('option');
    opt.value = String(y);
    opt.textContent = toNepaliNum(y);
    yearSel.appendChild(opt);
  }
  BS_MONTHS_NP.forEach((m,i)=>{
    const opt = document.createElement('option');
    opt.value = String(i+1);
    opt.textContent = (i+1)+' - '+m;
    monthSel.appendChild(opt);
  });

  function populateDays(preferredDay){
    const y = Number(yearSel.value), m = Number(monthSel.value);
    const maxDays = bsGetMonthDays(y, m) || 32;
    const keep = Math.min(preferredDay || Number(daySel.value) || bs.bsDate, maxDays);
    daySel.innerHTML = '';
    for(let d=1; d<=maxDays; d++){
      const opt = document.createElement('option');
      opt.value = String(d);
      opt.textContent = toNepaliNum(d);
      daySel.appendChild(opt);
    }
    daySel.value = String(keep);
  }

  yearSel.value = String(bs.bsYear);
  monthSel.value = String(bs.bsMonth);
  populateDays(bs.bsDate);

  yearSel.addEventListener('change', ()=>populateDays());
  monthSel.addEventListener('change', ()=>populateDays());

  wrap.appendChild(yearSel);
  wrap.appendChild(monthSel);
  wrap.appendChild(daySel);

  Object.defineProperty(wrap, 'value', {
    get(){
      const y = Number(yearSel.value), m = Number(monthSel.value), d = Number(daySel.value);
      const ad = bsToAdDate(y, m, d);
      if(!ad || isNaN(ad.getTime())) return '';
      const yyyy = ad.getFullYear(), mm = String(ad.getMonth()+1).padStart(2,'0'), dd = String(ad.getDate()).padStart(2,'0');
      return `${yyyy}-${mm}-${dd}`;
    },
    set(iso){
      const dt = (iso && !isNaN(new Date(iso).getTime())) ? new Date(iso) : new Date();
      const b = adToBs(dt);
      if(b){
        bs = b;
        yearSel.value = String(b.bsYear);
        monthSel.value = String(b.bsMonth);
        populateDays(b.bsDate);
      }
    }
  });

  return wrap;
}

/* ---------- image compression helper ---------- */
function readAndCompress(file, maxDim=400){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h = h*maxDim/w; w=maxDim; }
        else if(h>maxDim){ w = w*maxDim/h; h=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function readAnyFile(file){
  return new Promise((resolve, reject)=>{
    if(file.type === 'application/pdf'){
      const reader = new FileReader();
      reader.onload = ()=> resolve({dataUrl: reader.result, kind:'pdf', name:file.name});
      reader.onerror = reject;
      reader.readAsDataURL(file);
    } else {
      readAndCompress(file).then(dataUrl=>resolve({dataUrl, kind:'image', name:file.name})).catch(reject);
    }
  });
}

/* ---------- Excel export helper (item 32) ---------- */
function exportToExcel(rows, filename, sheetName){
  if(typeof XLSX === 'undefined'){ showToast('Excel library not loaded'); return; }
  if(!rows || rows.length===0){ showToast(t('noData')); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Sheet1');
  XLSX.writeFile(wb, filename);
}

async function doLogin(u,p){

  render();

let clockInterval = null;

function formatClock(){
  const now = new Date();
  const locale = STATE.lang!=='en' ? 'ne-NP' : 'en-US';
  const bs = adToBs(now);
  let dateStr;
  if(bs){
    const weekday = STATE.lang!=='en' ? NEPALI_WEEKDAYS_NP[now.getDay()] : NEPALI_WEEKDAYS_EN[now.getDay()];
    const monthName = STATE.lang!=='en' ? BS_MONTHS_NP[bs.bsMonth-1] : BS_MONTHS_EN[bs.bsMonth-1];
    dateStr = STATE.lang!=='en'
      ? `${weekday}, ${monthName} ${toNepaliNum(bs.bsDate)}, ${toNepaliNum(bs.bsYear)}`
      : `${weekday}, ${monthName} ${bs.bsDate}, ${bs.bsYear} B.S.`;
  } else {
    // outside the supported BS conversion range — fall back to the Gregorian date
    dateStr = now.toLocaleDateString(locale, {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  }
  const timeStr = now.toLocaleTimeString(locale, {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true});
  return {dateStr, timeStr};
}

function startClock(){
  if(clockInterval) clearInterval(clockInterval);
  const tick = ()=>{
    const dEl = document.getElementById('clockDate');
    const tEl = document.getElementById('clockTime');
    if(!dEl || !tEl){ clearInterval(clockInterval); clockInterval=null; return; }
    const {dateStr, timeStr} = formatClock();
    dEl.textContent = dateStr;
    tEl.textContent = timeStr;
  };
  tick();
  clockInterval = setInterval(tick, 1000);
}

function ClockBox(){
  const {dateStr, timeStr} = formatClock();
  return el('div',{class:'clock-box'},
    el('span',{class:'dot'}),
    el('div',{},
      el('div',{class:'cl'}, STATE.lang!=='en' ? 'आजको मिति र समय' : "Today's Date & Time"),
      el('div',{class:'cd', id:'clockDate'}, dateStr),
      el('div',{class:'ct', id:'clockTime'}, timeStr),
    )
  );
}

function youtubeEmbedUrl(url){
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{6,})/);
  return m ? 'https://www.youtube.com/embed/'+m[1] : null;
}

/* ---------- मौसम-आधारित कृषि सल्लाह ----------
   Uses the browser's geolocation + Open-Meteo (free, no API key needed) to
   pull today's temperature/wind/rain-probability for wherever the operator
   currently is, then applies a few simple, clearly-labelled rule-of-thumb
   suggestions. Not a replacement for an agronomist — just a quick signal. */
async function fetchWeatherAdvice(){
  STATE.weatherAdvice = {status:'loading'};
  render();
  if(typeof navigator === 'undefined' || !navigator.geolocation){
    STATE.weatherAdvice = {status:'error'};
    render();
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    try{
      const {latitude, longitude} = pos.coords;
      const url = 'https://api.open-meteo.com/v1/forecast?latitude='+latitude+'&longitude='+longitude+'&current=temperature_2m,wind_speed_10m&daily=precipitation_probability_max&timezone=auto';
      const res = await fetch(url);
      const data = await res.json();
      const temp = data.current ? data.current.temperature_2m : null;
      const wind = data.current ? data.current.wind_speed_10m : null;
      const rainChance = (data.daily && data.daily.precipitation_probability_max) ? data.daily.precipitation_probability_max[0] : null;
      let advice = t('weatherAdviceGood');
      if(rainChance!=null && rainChance >= 60) advice = t('weatherAdviceRain');
      else if(wind!=null && wind >= 30) advice = t('weatherAdviceWind');
      STATE.weatherAdvice = {status:'done', temp, wind, rainChance, advice, fetchedAt:new Date().toISOString()};
    }catch(e){ STATE.weatherAdvice = {status:'error'}; }
    render();
  }, ()=>{ STATE.weatherAdvice = {status:'error'}; render(); }, {timeout:10000});
}

/* Nepal Terai land-area units: 1 Bigha = 20 Kattha = 400 Dhur = 6772.63 m² */
const BIGHA_M2 = 6772.63, KATTHA_M2 = BIGHA_M2/20, DHUR_M2 = BIGHA_M2/400;
function m2ToBighaKatthaDhur(m2){
  let bigha = Math.floor(m2 / BIGHA_M2);
  let rem = m2 - bigha*BIGHA_M2;
  let kattha = Math.floor(rem / KATTHA_M2);
  rem = rem - kattha*KATTHA_M2;
  let dhur = Math.round(rem / DHUR_M2);
  if(dhur >= 20){ dhur -= 20; kattha += 1; }
  if(kattha >= 20){ kattha -= 20; bigha += 1; }
  return {bigha, kattha, dhur};
}
// Shoelace-formula polygon area, via a flat local-meters projection centred on
// the first vertex — accurate enough for the scale of a single farm plot.
function polygonAreaM2(points){
  if(points.length < 3) return 0;
  const R = 6378137;
  const lat0 = points[0].lat * Math.PI/180;
  const xy = points.map(p=>({
    x: (p.lng - points[0].lng) * Math.PI/180 * R * Math.cos(lat0),
    y: (p.lat - points[0].lat) * Math.PI/180 * R
  }));
  let area = 0;
  for(let i=0;i<xy.length;i++){
    const j = (i+1) % xy.length;
    area += xy[i].x*xy[j].y - xy[j].x*xy[i].y;
  }
  return Math.abs(area/2);
}

    if(katthaInput) katthaInput.value = bkd.kattha;
    if(dhurInput) dhurInput.value = bkd.dhur;
  };
  updateAreaBox();

  const redrawPolygon = ()=>{
    if(!farmerMapInstance) return;
    if(farmerLandPolygonLayer){ farmerMapInstance.removeLayer(farmerLandPolygonLayer); farmerLandPolygonLayer = null; }
    if(farmerLandPolygonPoints.length === 0) return;
    const latlngs = farmerLandPolygonPoints.map(p=>[p.lat,p.lng]);
    const group = L.layerGroup();
    if(farmerLandPolygonPoints.length >= 2){
      (farmerLandPolygonPoints.length >= 3 ? L.polygon(latlngs, {color:'#D4A72C', weight:2, fillColor:'#D4A72C', fillOpacity:0.25}) : L.polyline(latlngs, {color:'#D4A72C', weight:2})).addTo(group);
    }
    farmerLandPolygonPoints.forEach((p,i)=>{
      L.circleMarker([p.lat,p.lng], {radius:5, color:'#8A5A00', fillColor:'#FFD34D', fillOpacity:1, weight:2}).addTo(group);
    });
    farmerLandPolygonLayer = group.addTo(farmerMapInstance);
  };

  pickBtn.addEventListener('click', ()=>{
    farmerMapMode='pick';
    pickBtn.className = 'map-mode-btn on'; areaBtn.className = 'map-mode-btn';
    hint.textContent = '';
    areaBox.style.display = 'none'; polyActionsRow.style.display = 'none';
  });
  areaBtn.addEventListener('click', ()=>{
    farmerMapMode='polygon';
    areaBtn.className = 'map-mode-btn on'; pickBtn.className = 'map-mode-btn';
    hint.textContent = t('tapMapToAddPoint');
    areaBox.style.display = ''; polyActionsRow.style.display = '';
  });
  undoBtn.addEventListener('click', ()=>{ farmerLandPolygonPoints.pop(); redrawPolygon(); updateAreaBox(); });
  clearBtn.addEventListener('click', ()=>{ farmerLandPolygonPoints = []; redrawPolygon(); updateAreaBox(); });

  const initLandMap = ()=>{
    if(typeof L === 'undefined') return;
    farmerMapInstance = L.map(mapDiv).setView([28.3949, 84.1240], 7);

    const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
    });
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri', maxZoom: 19
    });
    streetLayer.addTo(farmerMapInstance);
    L.control.layers({[t('streetView')]: streetLayer, [t('satelliteView')]: satelliteLayer}, null, {position:'topright'}).addTo(farmerMapInstance);

    if(farmerFormLocation){
      farmerMapMarker = L.marker([farmerFormLocation.lat, farmerFormLocation.lng]).addTo(farmerMapInstance);
      farmerMapInstance.setView([farmerFormLocation.lat, farmerFormLocation.lng], 16);
    }
    redrawPolygon();

    farmerMapInstance.on('click', (e)=>{
      if(farmerMapMode === 'polygon'){
        farmerLandPolygonPoints.push({lat:e.latlng.lat, lng:e.latlng.lng});
        redrawPolygon();
        updateAreaBox();
        return;
      }
      farmerFormLocation = {lat: e.latlng.lat, lng: e.latlng.lng};
      if(farmerMapMarker) farmerMapInstance.removeLayer(farmerMapMarker);
      farmerMapMarker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(farmerMapInstance);
      updateNote();
    });
  };
  // ---- डाटा-सेभर मोड: सुस्त नेटमा नक्सा-टायल स्वतः नलोड होस्, थिचेपछि मात्र लोड होस् ----
  if(STATE.dataSaverMode){
    mapDiv.style.display='flex'; mapDiv.style.alignItems='center'; mapDiv.style.justifyContent='center';
    const loadBtn = el('button',{class:'btn btn-outline', type:'button', style:'width:auto;padding:8px 14px;'}, '🗺️ '+t('loadMapBtn'));
    loadBtn.addEventListener('click', ()=>{ mapDiv.innerHTML=''; mapDiv.style.display=''; initLandMap(); });
    mapDiv.appendChild(loadBtn);
  } else {
    setTimeout(initLandMap, 0);
  }

  return wrap;
}

const CROP_QUOTA_FORMULA_DEFAULT = {
  rice: {ureaPerKattha:3, dapPerKattha:2, potashPerKattha:1},
  maize: {ureaPerKattha:3.5, dapPerKattha:2, potashPerKattha:1},
  wheat: {ureaPerKattha:3, dapPerKattha:2, potashPerKattha:1},
  vegetable: {ureaPerKattha:2, dapPerKattha:3, potashPerKattha:2},
  potato: {ureaPerKattha:4, dapPerKattha:3, potashPerKattha:3},
};

/* ---------- बाली-आधारित वैज्ञानिक कोटा क्याल्कुलेटर ----------
   Illustrative agronomy formula (kg/kattha per crop) → suggested Urea/DAP/
   Potash bags, which the operator can review and push straight into the
   farmer's annual quota list below. Clearly marked as an estimate, not an
   authoritative Department of Agriculture recommendation. */
function CropQuotaCalculator(){
  const wrap = el('div',{class:'field', style:'margin-top:18px;border-top:1px dashed var(--line);padding-top:16px;'});
  wrap.appendChild(el('label',{}, t('cropSectionTitle')));
  wrap.appendChild(el('div',{class:'map-hint'}, t('cropSectionDesc')));

  const cropSelect = el('select',{},
    el('option',{value:''}, t('selectCrop')),
    el('option',{value:'rice'}, t('cropRice')),
    el('option',{value:'maize'}, t('cropMaize')),
    el('option',{value:'wheat'}, t('cropWheat')),
    el('option',{value:'vegetable'}, t('cropVegetable')),
    el('option',{value:'potato'}, t('cropPotato')),
  );
  const areaInput = el('input',{type:'number', min:'0', step:'0.5', placeholder:'0'});
  const resultBox = el('div',{style:'margin-top:10px;'});

  wrap.appendChild(el('div',{class:'grid'},
    el('div',{class:'field'}, el('label',{},t('cropName')), cropSelect),
    el('div',{class:'field'}, el('label',{},t('cropAreaKattha')), areaInput),
  ));
  wrap.appendChild(el('button',{class:'btn btn-outline', type:'button', style:'width:auto;padding:9px 16px;', onclick:()=>{
    const crop = cropSelect.value, area = Number(areaInput.value)||0;
    resultBox.innerHTML='';
    if(!crop || area<=0) return;
    const f = STATE.cropFormula[crop] || CROP_QUOTA_FORMULA_DEFAULT[crop];
    const ureaBags = Math.ceil((f.ureaPerKattha*area)/50);
    const dapBags = Math.ceil((f.dapPerKattha*area)/50);
    const potashBags = Math.ceil((f.potashPerKattha*area)/50);
    const suggestion = [
      {item:(STATE.lang!=='en'?'युरिया':'Urea'), bags:ureaBags},
      {item:'DAP', bags:dapBags},
      {item:(STATE.lang!=='en'?'पोटास':'Potash'), bags:potashBags},
    ];
    resultBox.appendChild(el('div',{style:'font-weight:700;font-size:12.5px;margin-bottom:6px;'}, t('calcQuotaResult')+':'));
    const tbl = el('table',{}, el('tr',{}, el('th',{},t('itemName')), el('th',{},t('bagsCount'))));
    suggestion.forEach(s=> tbl.appendChild(el('tr',{}, el('td',{},s.item), el('td',{},s.bags))));
    resultBox.appendChild(tbl);
    resultBox.appendChild(el('div',{class:'small-note', style:'margin-top:8px;'}, t('calcQuotaNote')));
    resultBox.appendChild(el('button',{class:'btn btn-primary', type:'button', style:'width:auto;padding:8px 14px;margin-top:8px;', onclick:()=>{
      suggestion.forEach(s=>{
        if(s.bags<=0) return;
        const existingRow = farmerFormNeeds.find(n=>n.item.trim().toLowerCase()===s.item.toLowerCase());
        if(existingRow) existingRow.bags = (Number(existingRow.bags)||0) + s.bags;
        else farmerFormNeeds.push({item:s.item, bags:s.bags, unitMode:'alt'});
      });
      if(farmerFormNeeds.length && !farmerFormNeeds[0].item.trim() && farmerFormNeeds.length>1) farmerFormNeeds.shift();
      farmerFormCropRegs.push({crop, areaKattha:area, fiscalYear: STATE.currentFiscalYear});
      showToast(t('addedToNeeds'));
      render();
    }}, t('addToNeeds')));
  }}, t('calcQuota')));

  wrap.appendChild(resultBox);
  return wrap;
}

function NeedsEditor(){
  const wrap = el('div',{});
  const list = el('div',{});
  const renderRows = ()=>{
    list.innerHTML='';
    if(STATE.products.length===0){
      list.appendChild(el('div',{class:'small-note'}, t('noProductsYet')));
    }
    farmerFormNeeds.forEach((row, idx)=>{
      const itemInput = ProductSelect();
      itemInput.value = row.item;
      const unitSelect = el('select',{});
      const refreshUnitOptions = ()=>{
        unitSelect.innerHTML='';
        const prod = productByName(row.item);
        if(prod){
          unitSelect.appendChild(el('option',{value:'std'}, catLabel(STD_UNITS, prod.standardUnit, prod.standardUnitCustom)));
          unitSelect.appendChild(el('option',{value:'alt'}, catLabel(ALT_UNITS, prod.alternateUnit, prod.alternateUnitCustom)));
          unitSelect.value = row.unitMode || 'alt';
        } else {
          unitSelect.appendChild(el('option',{value:'alt'}, 'बोरा'));
        }
      };
      refreshUnitOptions();
      itemInput.addEventListener('input', ()=>{ row.item = itemInput.value; refreshUnitOptions(); });
      unitSelect.addEventListener('change', ()=> row.unitMode = unitSelect.value);
      const bagsInput = el('input',{type:'number', min:'0', placeholder:t('bagsCount'), value: row.bags});
      bagsInput.addEventListener('input', ()=> row.bags = bagsInput.value);
      const delBtn = el('button',{class:'need-del', type:'button', onclick:()=>{
        if(farmerFormNeeds.length===1) return;
        farmerFormNeeds.splice(idx,1);
        renderRows();
      }}, '×');
      list.appendChild(el('div',{class:'need-row'}, itemInput, bagsInput, unitSelect, delBtn));
    });
  };
  renderRows();
  wrap.appendChild(el('label',{}, t('annualNeed')+' — '+t('workingFy')+' '+STATE.currentFiscalYear));
  wrap.appendChild(list);
  wrap.appendChild(el('button',{class:'need-add', type:'button', onclick:()=>{
    farmerFormNeeds.push({item:'', bags:'', unitMode:'alt'});
    renderRows();
  }}, t('addNewFertilizer')));
  return wrap;
}

// finishes an add/edit of a farmer once any national-duplicate check has been
// resolved (either no conflict was found, or the operator chose to proceed anyway)
async function commitFarmerSave(farmerData, editingFarmer, wasDupOverride){
  let savedFarmer;
  if(editingFarmer){
    Object.assign(editingFarmer, farmerData, {dupFlag: wasDupOverride ? dupWarningInfo : (editingFarmer.dupFlag||null)});
    editFarmerId = null;
    savedFarmer = editingFarmer;
  } else {
    savedFarmer = {
      id: genId('KI'),
      ...farmerData,
      dupFlag: wasDupOverride ? dupWarningInfo : null,
      coopName: STATE.user.coopName,
      createdAt: new Date().toISOString(),
    };
    STATE.farmers.push(savedFarmer);
  }
  await safeSet(tKey('farmers'), STATE.farmers, true);
  await registerNationalRecord(farmerData.citizenshipNo, {
    farmerId: savedFarmer.id, farmerName: savedFarmer.name, coopId: STATE.user.coopId,
    coopName: STATE.user.coopName, wardNo: savedFarmer.wardNo||'', date: new Date().toISOString(),
  });
  logAudit((editingFarmer ? (STATE.lang!=='en'?'किसान सम्पादन: ':'Edited farmer: ') : (STATE.lang!=='en'?'नयाँ किसान थपियो: ':'Added farmer: ')) + savedFarmer.name + ' ('+savedFarmer.id+')');
  triggerWebhook('farmer_'+(editingFarmer?'updated':'created'), savedFarmer);
  showToast(editingFarmer ? t('updatedMsg') : t('farmerSaved'));
  STATE.tab='farmers';
  farmerFormLocation = null;
  farmerFormHouseLocation = null;
  farmerLandPolygonPoints = [];
  farmerMapMode = 'pick';
  farmerFormLoadedFor = undefined;
  farmerFormCropRegs = [];
  dupWarningInfo = null;
  pendingFarmerSave = null;
  render();
}

// simple inline prompt-based flow to add a quota row for the current fiscal year
// to a farmer who doesn't have one yet (keeps the demo lightweight — no separate modal system)
function openAddQuotaPrompt(farmer){
  if(STATE.products.length===0){ showToast(t('noProductsYet')); return; }
  const itemName = prompt(t('selectFertilizerName')+' ('+STATE.products.map(p=>p.name).join(', ')+')');
  if(!itemName || !itemName.trim()) return;
  const bags = prompt(t('bagsCount'));
  if(!bags || Number(bags)<=0) return;
  const prod = productByName(itemName);
  const stdLbl = prod ? catLabel(STD_UNITS, prod.standardUnit, prod.standardUnitCustom) : 'kg';
  const altLbl = prod ? catLabel(ALT_UNITS, prod.alternateUnit, prod.alternateUnitCustom) : (STATE.lang!=='en'?'बोरा':'bora');
  const unitAns = prompt((STATE.lang!=='en'?'एकाइ छान्नुहोस्':'Choose unit')+' — 1='+altLbl+', 2='+stdLbl, '1');
  const unitMode = unitAns==='2' ? 'std' : 'alt';
  farmer.annualNeeds = farmer.annualNeeds || [];
  farmer.annualNeeds.push({item:itemName.trim(), bags:Number(bags), unitMode, fiscalYear: STATE.currentFiscalYear});
  safeSet(tKey('farmers'), STATE.farmers, true).then(()=>{
    showToast(t('quotaAddedForFy'));
    render();
  });
}

        const soldStd = STATE.sales.filter(s=>!s.voided && (s.depotId||'')===d.id).reduce((sum, sale)=> sum + getSaleItems(sale).filter(it=>it.itemName.toLowerCase()===nm).reduce((s,it)=>s+Number(it.qtyStandard!=null?it.qtyStandard:it.qty||0),0), 0);
        row.appendChild(el('td',{}, (purchasedStd-soldStd).toLocaleString()+' '+stdLbl));
      });
      depotTbl.appendChild(row);
    });
    depotPanel.appendChild(depotTbl);
    wrap.appendChild(depotPanel);
  }

}

function productByName(name){
  return STATE.products.find(p=>p.name.toLowerCase()===String(name).trim().toLowerCase());
}
function productDatalist(){
  const dl = el('datalist',{id:'productNamesList'});
  STATE.products.forEach(p=> dl.appendChild(el('option',{value:p.name})));
  return dl;
}
function ProductSelect(){
  const select = el('select',{});
  select.appendChild(el('option',{value:''}, t('selectProduct')));

  if(STATE.products.length===0) select.disabled = true;
  // fire 'input' too so existing listeners (written for text inputs) keep working unchanged
  select.addEventListener('change', ()=> select.dispatchEvent(new Event('input')));
  return select;
}
function unitSelectFor(itemInput){
  const select = el('select',{});
  const refresh = ()=>{
    select.innerHTML='';
    const prod = productByName(itemInput.value);
    if(prod){
      const stdLabel = catLabel(STD_UNITS, prod.standardUnit, prod.standardUnitCustom);
      const altLabel = catLabel(ALT_UNITS, prod.alternateUnit, prod.alternateUnitCustom);
      select.appendChild(el('option',{value:'std'}, stdLabel));
      select.appendChild(el('option',{value:'alt'}, altLabel+' (1 = '+prod.conversionRate+' '+stdLabel+')'));
    } else {
      select.appendChild(el('option',{value:'std'}, 'kg'));
    }
  };
  itemInput.addEventListener('input', refresh);
  refresh();
  return select;
}
function resolveUnitAndQty(itemInput, unitSelect, qtyRaw){
  const prod = productByName(itemInput.value);
  if(prod){
    const stdLabel = catLabel(STD_UNITS, prod.standardUnit, prod.standardUnitCustom);
    const altLabel = catLabel(ALT_UNITS, prod.alternateUnit, prod.alternateUnitCustom);
    if(unitSelect.value==='alt'){
      return {unit: altLabel, qtyStandard: qtyRaw*(prod.conversionRate||1)};
    }
    return {unit: stdLabel, qtyStandard: qtyRaw};
  }
  return {unit:'kg', qtyStandard: qtyRaw};
}

function deriveUnitMode(prod, unitLabel){
  if(!prod) return 'std';
  const altLabel = catLabel(ALT_UNITS, prod.alternateUnit, prod.alternateUnitCustom);
  return unitLabel === altLabel ? 'alt' : 'std';
}

function getSaleItems(sale){
  if(Array.isArray(sale.items)) return sale.items;
  return [{itemName:sale.itemName, qty:sale.qty, unit:sale.unit||'kg', qtyStandard:sale.qtyStandard, rate:sale.rate, total:sale.total}];
}

function stockFor(itemName, excludePurchaseId, excludeSaleId){
  const nm = itemName.toLowerCase();
  const purchased = STATE.purchases.reduce((sum, bill)=>{
    if(excludePurchaseId && bill.id===excludePurchaseId) return sum;
    if(Array.isArray(bill.items)){
      return sum + bill.items.filter(it=>it.itemName.toLowerCase()===nm).reduce((s,it)=>s+Number(it.qtyStandard||0),0);
    }
    if(bill.itemName && bill.itemName.toLowerCase()===nm){
      return sum + Number(bill.qtyStandard!=null?bill.qtyStandard:bill.qty||0);
    }
    return sum;
  },0);
  const sold = STATE.sales.reduce((sum, sale)=>{
    if(sale.voided) return sum;
    if(excludeSaleId && sale.id===excludeSaleId) return sum;
    return sum + getSaleItems(sale).filter(it=>it.itemName.toLowerCase()===nm).reduce((s,it)=>s+Number(it.qtyStandard!=null?it.qtyStandard:it.qty||0),0);
  },0);
  return purchased - sold;
}

function getBillItems(bill){
  if(Array.isArray(bill.items)) return bill.items;
  return [{itemName:bill.itemName, qty:bill.qty, unit:bill.unit||'kg'}];
}

function computePurchaseRow(row, excludePurchaseId){
  const prod = productByName(row.item);
  const qty = Number(row.qty)||0;
  const price = Number(row.price)||0;
  const disc = Number(row.disc)||0;
  const remStock = row.item.trim() ? stockFor(row.item.trim(), excludePurchaseId) : 0;
  const uomLabel = prod ? (row.unitMode==='alt' ? catLabel(ALT_UNITS,prod.alternateUnit,prod.alternateUnitCustom) : catLabel(STD_UNITS,prod.standardUnit,prod.standardUnitCustom)) : 'kg';
  const qtyStandard = prod ? (row.unitMode==='alt' ? qty*(prod.conversionRate||1) : qty) : qty;
  const netStock = remStock + qtyStandard;
  const gross = qty*price;
  const discAmt = gross*disc/100;
  const netAmount = gross - discAmt;
  return {remStock, uomLabel, qtyStandard, netStock, gross, discAmt, netAmount};
}

function computeSaleRow(row, excludeSaleId){
  const prod = productByName(row.item);
  const qty = Number(row.qty)||0;
  const rate = Number(row.rate)||0;
  const remStock = row.item.trim() ? stockFor(row.item.trim(), null, excludeSaleId) : 0;
  const uomLabel = prod ? (row.unitMode==='alt' ? catLabel(ALT_UNITS,prod.alternateUnit,prod.alternateUnitCustom) : catLabel(STD_UNITS,prod.standardUnit,prod.standardUnitCustom)) : 'kg';
  const qtyStandard = prod ? (row.unitMode==='alt' ? qty*(prod.conversionRate||1) : qty) : qty;
  const total = qty*rate;
  return {remStock, uomLabel, qtyStandard, total};
}

// Auto sequential sale bill number, scoped per fiscal year (resets to 1 on a new FY) —
// zero-padded to 6 digits so it comfortably holds up to 999999 (covers the ≥500000 requirement)
function nextSaleBillNumber(){
  const countThisFy = STATE.sales.filter(s=>(s.fiscalYear||STATE.currentFiscalYear)===STATE.currentFiscalYear).length;
  return String(countThisFy+1).padStart(6,'0');
}

function getFarmerQuota(farmer, itemName, excludeSaleId){
  if(!farmer.annualNeeds || !itemName.trim()) return null;
  const need = farmer.annualNeeds.find(n=>n.item.toLowerCase()===itemName.trim().toLowerCase() && (n.fiscalYear||STATE.currentFiscalYear)===STATE.currentFiscalYear);
  if(!need) return null;
  const prod = productByName(itemName);
  const unitMode = need.unitMode || 'alt'; // legacy needs (no unitMode saved) were always entered in bora
  const limitStd = unitMode==='std' ? Number(need.bags) : Number(need.bags)*(prod?(prod.conversionRate||1):1);
  const nm = itemName.trim().toLowerCase();
  const usedStd = STATE.sales.filter(s=>s.farmerId===farmer.id && (s.fiscalYear||STATE.currentFiscalYear)===STATE.currentFiscalYear && s.id!==excludeSaleId && !s.voided)
    .reduce((sum,sale)=> sum + getSaleItems(sale).filter(it=>it.itemName.toLowerCase()===nm).reduce((s,it)=>s+Number(it.qtyStandard!=null?it.qtyStandard:it.qty||0),0), 0);
  return {limitStd, usedStd, remainingStd: limitStd-usedStd};
}

let editSaleId = null;
let saleOtpState = {sent:false, code:'', verified:false, forFarmerId:null};

function SaleView(){
  const wrap = el('div',{class:'content'});
  const editingSale = editSaleId ? STATE.sales.find(x=>x.id===editSaleId) : null;
  const formPanel = el('div',{class:'panel'});
  formPanel.appendChild(el('h2',{}, editingSale ? t('updateSale') : t('saleTitle')));
  formPanel.appendChild(el('div',{class:'desc'}, t('saleDesc')+' — '+t('workingFy')+' '+STATE.currentFiscalYear));
  if(editingSale){
    formPanel.appendChild(el('div',{class:'small-note', style:'background:#FDF1D9;border-color:#E8C46B;display:flex;justify-content:space-between;align-items:center;'},
      el('span',{}, '✏️ '+t('editingRecord')+': '+(editingSale.billNumber||editingSale.id)+' — '+editingSale.farmerName),
      el('button',{class:'btn btn-outline', type:'button', style:'width:auto;padding:5px 12px;font-size:11.5px;', onclick:()=>{ editSaleId=null; render(); }}, t('cancelEdit'))
    ));
  }

  // customer type toggle
  let customerType = editingSale ? editingSale.customerType : (STATE.farmers.length ? 'registered' : 'unregistered');
  const typeWrap = el('div',{class:'tabs'});
  const regTab = el('button',{type:'button', class:'tab'+(customerType==='registered'?' on':'')}, '🧑‍🌾 '+t('registeredFarmerOpt'));
  const unregTab = el('button',{type:'button', class:'tab'+(customerType==='unregistered'?' on':'')}, '🧾 '+t('unregisteredOpt'));
  typeWrap.appendChild(regTab); typeWrap.appendChild(unregTab);
  formPanel.appendChild(el('label',{}, t('customerType')));
  formPanel.appendChild(typeWrap);

  const registeredBlock = el('div',{});
  const unregisteredBlock = el('div',{});

  // -- Registered farmer block --
  const farmerSelect = el('select',{});
  STATE.farmers.forEach(f=> farmerSelect.appendChild(el('option',{value:f.id}, f.name+' ('+f.id+')')));
  if(editingSale && editingSale.farmerId) farmerSelect.value = editingSale.farmerId;
  const scanInput = el('input',{type:'text', placeholder:t('scanPlaceholder'), style:'font-family:JetBrains Mono,monospace;'});
  const scanNote = el('div',{class:'small-note'}, '');
  scanInput.addEventListener('keydown', (e)=>{
    if(e.key!=='Enter') return;
    e.preventDefault();
    const code = scanInput.value.trim();
    if(!code) return;
    const found = STATE.farmers.find(f=>f.id.toLowerCase()===code.toLowerCase());
    if(found){
      farmerSelect.value = found.id;
      scanNote.innerHTML = '';
      scanNote.appendChild(el('span',{style:'color:var(--ok);font-weight:700;'}, t('farmerFound')+' '+found.name));
      updateFarmerRecord();
      rebuildRows();
    } else {
      scanNote.innerHTML = '';
      scanNote.appendChild(el('span',{style:'color:var(--danger);font-weight:700;'}, t('farmerNotFound')));
    }
    scanInput.value = '';
    scanInput.focus();
  });
  registeredBlock.appendChild(el('div',{class:'field'}, el('label',{}, '📷 '+t('scanBarcode')), scanInput));
  registeredBlock.appendChild(scanNote);
  registeredBlock.appendChild(el('div',{class:'field'}, el('label',{},t('selectFarmer')), farmerSelect));
  const farmerRecordBox = el('div',{style:'margin-top:10px;'});
  registeredBlock.appendChild(farmerRecordBox);
  const otpBox = el('div',{style:'margin-top:10px;'});
  registeredBlock.appendChild(otpBox);

  // ---- OTP-प्रमाणित खरिद: बिचौलिया रोकथाम — किसान आफैं वा फोन नजिक नभई बिक्री टुंगिन नदिने ----
  function refreshOtpBox(){
    otpBox.innerHTML='';
    if(customerType!=='registered') return;
    const farmer = STATE.farmers.find(f=>f.id===farmerSelect.value);
    if(!farmer) return;
    if(saleOtpState.forFarmerId !== farmer.id){
      saleOtpState = {sent:false, code:'', verified:false, forFarmerId:farmer.id};
    }
    const box = el('div',{class:'small-note'});
    box.appendChild(el('div',{style:'font-weight:700;color:var(--ink);'}, t('otpTitle')));
    box.appendChild(el('div',{style:'margin-top:2px;'}, t('otpDesc')));
    if(!saleOtpState.sent){
      box.appendChild(el('button',{class:'btn btn-outline', type:'button', style:'width:auto;padding:7px 14px;margin-top:8px;', onclick:()=>{
        saleOtpState.code = String(Math.floor(1000+Math.random()*9000));
        saleOtpState.sent = true;
        showToast(t('otpSentMsg'));
        refreshOtpBox();
      }}, '📲 ' + t('otpSendBtn')));
    } else if(!saleOtpState.verified){
      box.appendChild(el('div',{style:'margin-top:8px;font-family:JetBrains Mono,monospace;font-size:16px;font-weight:800;color:var(--forest);'}, '🔐 '+saleOtpState.code));
      const otpInput = el('input',{type:'text', maxlength:'4', placeholder:'0000', style:'width:100px;font-family:JetBrains Mono,monospace;font-size:16px;letter-spacing:3px;margin-top:6px;'});
      const otpErr = el('div',{});
      box.appendChild(el('div',{class:'field', style:'max-width:160px;margin-top:4px;'}, el('label',{},t('otpEnterLabel')), otpInput));
      box.appendChild(otpErr);
      box.appendChild(el('button',{class:'btn btn-primary', type:'button', style:'width:auto;padding:7px 14px;margin-top:4px;', onclick:()=>{
        if(otpInput.value.trim() === saleOtpState.code){
          saleOtpState.verified = true;
          refreshOtpBox();
        } else {
          otpErr.innerHTML='';
          otpErr.appendChild(el('div',{class:'err', style:'margin-top:6px;'}, t('otpWrongMsg')));
        }
      }}, '✅ ' + t('otpVerifyBtn')));
    } else {
      box.appendChild(el('div',{style:'margin-top:8px;color:var(--ok);font-weight:800;'}, t('otpVerifiedMsg')));
    }
    box.appendChild(el('div',{style:'margin-top:8px;font-size:11px;color:var(--ink-soft);'}, t('otpDemoNote')));
    otpBox.appendChild(box);
  }

  // -- Unregistered block --
  const custNameInput = el('input',{type:'text', value: (editingSale && editingSale.customerType==='unregistered') ? editingSale.farmerName : ''});
  const custMobileInput = el('input',{type:'text', value: (editingSale && editingSale.customerType==='unregistered') ? (editingSale.customerMobile||'') : ''});
  const custAddrInput = el('input',{type:'text', value: (editingSale && editingSale.customerType==='unregistered') ? (editingSale.customerAddress||'') : ''});
  unregisteredBlock.appendChild(el('div',{class:'grid'},
    el('div',{class:'field'}, el('label',{}, t('customerName'), el('span',{class:'req'},'*')), custNameInput),
    el('div',{class:'field'}, el('label',{},t('customerMobile')), custMobileInput),
    el('div',{class:'field'}, el('label',{},t('customerAddress')), custAddrInput),
  ));

  formPanel.appendChild(registeredBlock);
  formPanel.appendChild(unregisteredBlock);

  // -- Multi-item sale table (mirrors the purchase bill's item table) --
  formPanel.appendChild(el('h2',{style:'margin-top:20px;font-size:14px;'}, t('stockItems')));
  const itemsWrap = el('div',{style:'overflow-x:auto;'});
  const itemsTable = el('table',{style:'min-width:820px;'});
  const theadRow = el('tr',{},
    el('th',{},t('itemNameBarcode')), el('th',{},t('remStock')), el('th',{},t('quantity')), el('th',{},t('uom')),
    el('th',{},t('ratePerKg')), el('th',{},t('netAmountItem')), el('th',{},t('actionCol'))
  );
  itemsTable.appendChild(theadRow);
  itemsWrap.appendChild(itemsTable);
  formPanel.appendChild(itemsWrap);

  let saleItems = editingSale
    ? getSaleItems(editingSale).map(it=>{
        const prod = productByName(it.itemName);
        return {item: it.itemName, qty: String(it.qty), rate: String(it.rate||0), unitMode: deriveUnitMode(prod, it.unit), _autoRate:null};
      })
    : [{item:'', qty:'', rate:'', unitMode:'std', _autoRate:null}];
  if(saleItems.length===0) saleItems = [{item:'', qty:'', rate:'', unitMode:'std', _autoRate:null}];

  const totalBox = el('div',{class:'stat', style:'margin-top:14px;max-width:320px;'});
  formPanel.appendChild(totalBox);
  const lockBox = el('div',{});

  const nextBillNo = editingSale ? editingSale.billNumber : nextSaleBillNumber();
  function refreshTotal(){
    const grand = saleItems.reduce((s,row)=> s + computeSaleRow(row, editSaleId).total, 0);
    totalBox.innerHTML = '';
    totalBox.appendChild(el('div',{class:'n'}, fmtMoney(grand)));
    totalBox.appendChild(el('div',{class:'l'}, t('totalAmt')+' — '+t('billNo')+': '+nextBillNo));
  }

  const updateFarmerRecord = ()=>{
    farmerRecordBox.innerHTML='';
    if(customerType!=='registered'){ otpBox.innerHTML=''; return; }
    const farmer = STATE.farmers.find(f=>f.id===farmerSelect.value);
    if(!farmer){ otpBox.innerHTML=''; return; }
    refreshOtpBox();
    const needsThisFy = (farmer.annualNeeds||[]).filter(n=>(n.fiscalYear||STATE.currentFiscalYear)===STATE.currentFiscalYear);
    if(needsThisFy.length===0) return;
    const tbl = el('table',{},
      el('tr',{}, el('th',{},t('itemName')), el('th',{},t('annualLimit')), el('th',{},t('alreadyUsed')), el('th',{},t('remainingQty')))
    );
    needsThisFy.forEach(n=>{
      const q = getFarmerQuota(farmer, n.item, editSaleId);
      if(!q) return;
      const prod = productByName(n.item);
      const stdLbl = prod ? catLabel(STD_UNITS, prod.standardUnit, prod.standardUnitCustom) : 'kg';
      tbl.appendChild(el('tr',{},
        el('td',{}, n.item),
        el('td',{}, q.limitStd.toFixed(1)+' '+stdLbl),
        el('td',{}, q.usedStd.toFixed(1)+' '+stdLbl),
        el('td',{}, el('span',{style:'font-weight:700;color:'+(q.remainingStd<=0?'var(--danger)':'var(--ok)')+';'}, Math.max(0,q.remainingStd).toFixed(1)+' '+stdLbl)),
      ));
    });
    farmerRecordBox.appendChild(el('div',{style:'font-size:12px;font-weight:700;margin-bottom:4px;'}, STATE.lang!=='en'?('किसानको यस आ.व. ('+STATE.currentFiscalYear+') रेकर्ड:'):('Farmer record for FY '+STATE.currentFiscalYear+':')));
    farmerRecordBox.appendChild(tbl);
  };

  function renderSaleRow(row, idx){
    const itemInput = ProductSelect();
    itemInput.value = row.item;
    itemInput.style.minWidth = '140px';
    const remStockSpan = el('span',{}, '0');
    const qtyInput = el('input',{type:'number', value:row.qty, style:'width:80px;'});
    const uomSelect = el('select',{});
    const rateInput = el('input',{type:'number', value:row.rate, style:'width:90px;'});
    const amountSpan = el('span',{}, 'रु. 0');
    const delBtn = el('button',{class:'need-del', type:'button', onclick:()=>{
      if(saleItems.length===1) return;
      saleItems.splice(idx,1);
      rebuildRows();
    }}, '×');

    const refreshUom = ()=>{
      uomSelect.innerHTML='';
      const prod = productByName(row.item);
      if(prod){
        const stdLabel = catLabel(STD_UNITS, prod.standardUnit, prod.standardUnitCustom);
        const altLabel = catLabel(ALT_UNITS, prod.alternateUnit, prod.alternateUnitCustom);
        uomSelect.appendChild(el('option',{value:'std'}, stdLabel));
        uomSelect.appendChild(el('option',{value:'alt'}, altLabel));
        uomSelect.value = row.unitMode;
      } else {
        uomSelect.appendChild(el('option',{value:'std'}, 'kg'));
      }
    };
    const refreshComputed = ()=>{
      const c = computeSaleRow(row, editSaleId);
      remStockSpan.textContent = c.remStock + ' ' + catLabel(STD_UNITS, (productByName(row.item)||{}).standardUnit||'kg', '');
      remStockSpan.style.color = c.remStock<=0 ? 'var(--danger)' : '';
      amountSpan.textContent = fmtMoney(c.total);
      refreshTotal();
    };
    const autofillRate = ()=>{
      const prod = productByName(row.item);
      if(!prod) return;
      const rate = row.unitMode==='alt' ? prod.saleRateAlt : prod.saleRateStd;
      if(rate && (!rateInput.value || Number(rateInput.value)===row._autoRate)){
        rateInput.value = rate;
        row.rate = rate;
        row._autoRate = rate;
      }
    };
    itemInput.addEventListener('input', ()=>{ row.item = itemInput.value; refreshUom(); autofillRate(); refreshComputed(); });
    qtyInput.addEventListener('input', ()=>{ row.qty = qtyInput.value; refreshComputed(); });
    rateInput.addEventListener('input', ()=>{ row.rate = rateInput.value; refreshComputed(); });
    uomSelect.addEventListener('change', ()=>{ row.unitMode = uomSelect.value; autofillRate(); refreshComputed(); });

    refreshUom();
    refreshComputed();

    return el('tr',{},
      el('td',{}, itemInput),
      el('td',{}, remStockSpan),
      el('td',{}, qtyInput),
      el('td',{}, uomSelect),
      el('td',{}, rateInput),
      el('td',{}, amountSpan),
      el('td',{}, delBtn),
    );
  }

  function rebuildRows(){
    itemsTable.querySelectorAll('tr:not(:first-child)').forEach(r=>r.remove());
    saleItems.forEach((row,idx)=> itemsTable.appendChild(renderSaleRow(row, idx)));
    refreshTotal();
  }
  rebuildRows();

  formPanel.appendChild(el('button',{class:'need-add', type:'button', style:'margin-top:10px;', onclick:()=>{
    saleItems.push({item:'', qty:'', rate:'', unitMode:'std', _autoRate:null});
    rebuildRows();
  }}, t('addStockItem')));

  const payInput = el('select',{}, el('option',{value:'cash'},t('cash')), el('option',{value:'bank'},t('bank')));
  if(editingSale) payInput.value = editingSale.paymentType||'cash';
  const saleBankBlock = BankSelect();
  if(editingSale && editingSale.paymentType==='bank' && editingSale.bankName){
    if(NEPAL_BANKS.includes(editingSale.bankName)){ saleBankBlock._select.value = editingSale.bankName; }
    else { saleBankBlock._select.value = NEPAL_BANKS[NEPAL_BANKS.length-1]; saleBankBlock._custom.value = editingSale.bankName; saleBankBlock._custom.style.display='block'; }
  }
  saleBankBlock.style.display = (editingSale && editingSale.paymentType==='bank') ? '' : 'none';
  payInput.addEventListener('change', ()=>{ saleBankBlock.style.display = payInput.value==='bank' ? '' : 'none'; });
  const dateInput = BsDateField(editingSale?editingSale.date:new Date().toISOString().slice(0,10));
  const saleDepotSelect = STATE.depots.length ? el('select',{},
    el('option',{value:''}, t('mainDepot')),
    ...STATE.depots.map(d=>el('option',{value:d.id, ...((editingSale&&editingSale.depotId===d.id)?{selected:'selected'}:{})}, d.name)),
  ) : null;
  const subsidyCheck = el('input',{type:'checkbox'});
  subsidyCheck.checked = !!(editingSale && editingSale.subsidy);
  const subsidyPctInput = el('input',{type:'number', value: editingSale?(editingSale.subsidyPct||50):'50'});
  subsidyPctInput.disabled = !subsidyCheck.checked;
  subsidyCheck.addEventListener('change', ()=>{ subsidyPctInput.disabled = !subsidyCheck.checked; });

  function refreshTypeUI(){
    regTab.className = 'tab'+(customerType==='registered'?' on':'');
    unregTab.className = 'tab'+(customerType==='unregistered'?' on':'');
    registeredBlock.style.display = customerType==='registered' ? '' : 'none';
    unregisteredBlock.style.display = customerType==='unregistered' ? '' : 'none';
    updateFarmerRecord();
  }
  regTab.addEventListener('click', ()=>{
    if(STATE.farmers.length===0){ showToast(t('noFarmerYet')); return; }
    customerType='registered'; refreshTypeUI();
  });
  unregTab.addEventListener('click', ()=>{ customerType='unregistered'; refreshTypeUI(); });
  farmerSelect.addEventListener('change', updateFarmerRecord);
  refreshTypeUI();

  formPanel.appendChild(el('div',{class:'grid', style:'margin-top:10px;'},
    el('div',{class:'field'}, el('label',{},t('paymentType')), payInput),
    el('div',{class:'field'}, el('label',{},t('date')), dateInput),
    saleDepotSelect ? el('div',{class:'field'}, el('label',{},t('selectDepot')), saleDepotSelect) : null,
  ));
  formPanel.appendChild(el('div',{class:'field', style:'max-width:320px;'}, saleBankBlock));
  formPanel.appendChild(lockBox);
  formPanel.appendChild(el('div',{class:'field', style:'margin-top:10px;display:flex;align-items:center;gap:8px;'},
    subsidyCheck, el('label',{style:'margin:0;'}, t('isSubsidy'))
  ));
  formPanel.appendChild(el('div',{class:'field', style:'max-width:220px;'}, el('label',{},t('subsidyPct')), subsidyPctInput));

  formPanel.appendChild(totalBox);

  formPanel.appendChild(el('div',{style:'display:flex;gap:10px;margin-top:12px;'},
    el('button',{class:'btn btn-primary', style:'width:auto;padding:11px 22px;', onclick: async ()=>{
    lockBox.innerHTML='';
    const validRows = saleItems.filter(r=>r.item.trim() && Number(r.qty)>0);
    if(validRows.length===0){ showToast(t('fillRequired')); return; }
    let farmer = null;
    if(customerType==='registered'){
      farmer = STATE.farmers.find(f=>f.id===farmerSelect.value);
      if(!farmer){ showToast(t('fillRequired')); return; }
    } else {
      if(!custNameInput.value.trim()){ showToast(t('fillRequired')); return; }
    }

    // ---- Business Rule: Automatic annual quota LOCK for registered farmers, per fiscal year, checked per item ----
    if(customerType==='registered'){
      const violations = [];
      validRows.forEach(r=>{
        const c = computeSaleRow(r, editSaleId);
        const q = getFarmerQuota(farmer, r.item.trim(), editSaleId);
        if(q && c.qtyStandard > q.remainingStd){
          const prod = productByName(r.item);
          const stdLbl = prod ? catLabel(STD_UNITS, prod.standardUnit, prod.standardUnitCustom) : 'kg';
          violations.push(r.item+': '+t('lockedMsg')+' '+Math.max(0,q.remainingStd).toFixed(1)+' '+stdLbl);
        }
      });
      if(violations.length){
        lockBox.appendChild(el('div',{class:'err'},
          el('b',{},t('lockTitle')), el('br'),
          '['+STATE.currentFiscalYear+'] ' + violations.join(' | ')
        ));
        return; // Sale save blocked — client-side enforcement only, see chat note on backend limits
      }
    }

    // ---- OTP-प्रमाणित खरिद: दर्ता भएको किसानको हकमा OTP प्रमाणित नभई बिक्री टुंगिन नदिने (सम्पादन मोडमा आवश्यक पर्दैन) ----
    if(customerType==='registered' && !editingSale && !saleOtpState.verified){
      showToast(t('otpTitle'));
      refreshOtpBox();
      return;
    }

    const computedItems = validRows.map(r=>{
      const c = computeSaleRow(r, editSaleId);
      return { itemName: r.item.trim(), qty:Number(r.qty)||0, unit:c.uomLabel, qtyStandard:c.qtyStandard, rate:Number(r.rate)||0, total:c.total };
    });
    const grandTotal = computedItems.reduce((s,it)=>s+it.total,0);
    const isSub = subsidyCheck.checked;
    const subPct = isSub ? Number(subsidyPctInput.value)||0 : 0;
    const subsidyAmount = isSub ? Math.round(grandTotal*subPct/100) : 0;
    const saleData = {
      customerType,
      farmerId: farmer ? farmer.id : null,
      farmerName: farmer ? farmer.name : custNameInput.value.trim(),
      customerMobile: farmer ? farmer.phone : custMobileInput.value.trim(),
      customerAddress: farmer ? farmer.address : custAddrInput.value.trim(),
      items: computedItems,
      total: grandTotal,
      subsidy: isSub,
      subsidyPct: subPct,
      subsidyAmount,
      farmerPay: grandTotal - subsidyAmount,
      paymentType: payInput.value,
      bankName: payInput.value==='bank' ? saleBankBlock._value() : '',
      date: dateInput.value,
      depotId: saleDepotSelect ? saleDepotSelect.value : '',
    };
    if(editingSale){
      Object.assign(editingSale, saleData);
      editSaleId = null;
    } else {
      STATE.sales.push({
        id: genId('BI'),
        billNumber: nextSaleBillNumber(),
        ...saleData,
        fiscalYear: STATE.currentFiscalYear,
        createdAt: new Date().toISOString(),
        coopName: STATE.user.coopName,
      });
      // बिक्रीबाट किसानले तिरेको रकम सोही भुक्तानी माध्यममा थपिने
      if(saleData.paymentType==='cash') STATE.treasury.cash += saleData.farmerPay;
      else if(saleData.paymentType==='bank') STATE.treasury.bank += saleData.farmerPay;
      await safeSet(tKey('treasury'), STATE.treasury, true);
    }
    await safeSet(tKey('sales'), STATE.sales, true);
    saleOtpState = {sent:false, code:'', verified:false, forFarmerId:null};
    logAudit((editingSale?(STATE.lang!=='en'?'बिक्री सम्पादन: ':'Edited sale: '):(STATE.lang!=='en'?'नयाँ बिक्री: ':'New sale: '))+(editingSale?editingSale.billNumber:saleData.farmerName));
    triggerWebhook('sale_'+(editingSale?'updated':'created'), saleData);
    showToast(editingSale ? t('updatedMsg') : t('saleSaved'));
    render();
  }}, editingSale ? t('updateSale') : t('saveSale')),
    editingSale ? el('button',{class:'btn btn-outline', type:'button', style:'width:auto;padding:11px 22px;', onclick:()=>{ editSaleId=null; render(); }}, t('cancelEdit')) : null,
  ));

  wrap.appendChild(formPanel);

  const listPanel = el('div',{class:'panel'});
  const listHead = el('div',{style:'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;'},
    el('h2',{style:'margin:0;'}, t('saleHistory')),
    el('button',{class:'export-btn', onclick:()=>{
      const rows = STATE.sales.map(s=>({
        [t('date')]: fmtDate(s.date),
        [t('time')]: fmtTime(s.createdAt),
        [t('customerType')]: s.customerType==='unregistered' ? t('unregisteredOpt') : t('registeredFarmerOpt'),
        [t('farmerName')]: s.farmerName,
        [t('itemsPurchasedCol')]: getSaleItems(s).map(it=>it.itemName+' ('+it.qty+' '+(it.unit||'kg')+')').join(', '),
        [t('totalAmt')]: s.total,
        [t('paymentType')]: t(s.paymentType),
        [t('isSubsidy')]: s.subsidy ? s.subsidyPct+'%' : (STATE.lang!=='en'?'पूरा':'Full'),
        [t('fiscalYears')]: s.fiscalYear||'-',
      }));
      exportToExcel(rows, 'sale-history.xlsx', 'Sales');
