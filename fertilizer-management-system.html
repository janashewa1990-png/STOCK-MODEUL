/* ===================== SUBSIDY REPORT VIEW ===================== */
// One row per item sold, whether or not the sale was under subsidy — this is
// the single unified Report: name, address, contact, citizenship no., land
// area, item name, quantity, and item price for every sale.
function buildFullReportRows(){
  const rows = [];
  STATE.sales.filter(s=>!s.voided).forEach(s=>{
    const farmer = s.farmerId ? STATE.farmers.find(f=>f.id===s.farmerId) : null;
    const landTxt = farmer && farmer.land
      ? [farmer.land.bigha? farmer.land.bigha+' '+t('bigha'):null, farmer.land.kattha? farmer.land.kattha+' '+t('kattha'):null, farmer.land.dhur? farmer.land.dhur+' '+t('dhur'):null].filter(Boolean).join(', ') || '-'
      : ((farmer && farmer.landArea) ? farmer.landArea : '-');
    const name = farmer ? farmer.name : (s.farmerName || '-');
    const address = farmer ? (farmer.address || '-') : (s.customerAddress || '-');
    const contact = farmer ? (farmer.phone || '-') : (s.customerMobile || '-');
    const citizenship = farmer ? (farmer.citizenshipNo || '-') : '-';
    getSaleItems(s).forEach(it=>{
      rows.push({
        date: s.date,
        name, address, contact, citizenship, land: landTxt,
        itemName: it.itemName, qty: it.qty, unit: it.unit || 'kg', rate: Number(it.rate || 0)
      });
    });
  });
  return rows;
}

/* ===================== पालिका अनुगमन: सबै मातहतका सहकारी एकैचोटि ===================== */
function MonitoringView(){

    panel.appendChild(el('div',{class:'empty'}, el('div',{class:'ic'},'🌾'), t('noChildSahakari')));

    return wrap;
  }

  const totals = results.reduce((a,r)=>{
    a.farmers += r.farmers.length;
    a.purchase += r.purchases.reduce((s,p)=>s+Number(p.total||0),0);
    a.sale += r.sales.filter(x=>!x.voided).reduce((s,x)=>s+Number(x.total||0),0);
    a.subsidy += r.sales.filter(x=>x.subsidy && !x.voided).reduce((s,x)=>s+Number(x.subsidyAmount||0),0);

  );
  [...results].sort((a,b)=>b.farmers.length-a.farmers.length).forEach(r=>{
    const purchaseSum = r.purchases.reduce((s,p)=>s+Number(p.total||0),0);
    const saleSum = r.sales.filter(x=>!x.voided).reduce((s,x)=>s+Number(x.total||0),0);
    const subsidySum = r.sales.filter(x=>x.subsidy && !x.voided).reduce((s,x)=>s+Number(x.subsidyAmount||0),0);

      el('td',{}, fmtMoney(purchaseSum)),

      el('td',{}, fmtMoney(subsidySum)),

    panel.appendChild(el('div',{class:'empty'}, el('div',{class:'ic'},'🗺️'), t('noWardData')));
    wrap.appendChild(panel);
    return wrap;
  }

  const byWard = {};
  farmersWithWard.forEach(f=>{
    const w = String(f.wardNo);
    if(!byWard[w]) byWard[w] = {farmers:0, quotaBags:0, sold:0, subsidy:0};
    byWard[w].farmers++;
    (f.annualNeeds||[]).filter(n=>(n.fiscalYear||STATE.currentFiscalYear)===STATE.currentFiscalYear)
      .forEach(n=> byWard[w].quotaBags += Number(n.bags)||0);
  });
  const farmerWardMap = {};
  STATE.farmers.forEach(f=>{ if(f.wardNo) farmerWardMap[f.id] = String(f.wardNo); });
  STATE.sales.filter(s=>!s.voided).forEach(s=>{
    const w = s.farmerId ? farmerWardMap[s.farmerId] : null;
    if(!w || !byWard[w]) return;
    byWard[w].sold += Number(s.total)||0;
    if(s.subsidy) byWard[w].subsidy += Number(s.subsidyAmount)||0;
  });

  const wardKeys = Object.keys(byWard).sort((a,b)=>Number(a)-Number(b));

  // पालिका → वडा बाँडफाँड (top-down, editable)
  panel.appendChild(el('h3',{style:'font-size:14px;margin:18px 0 4px;'}, '🏛️ ' + t('wardAllocTitle')));

  );

    allocInputs[w] = input;
    const pct = currentAlloc ? Math.round((d.quotaBags/currentAlloc)*100) : null;
    allocTbl.appendChild(el('tr',{},
      el('td',{}, el('span',{class:'badge badge-subsidy'}, t('wardNoShort')+' '+w)),
      el('td',{}, d.farmers),
      el('td',{}, input),
      el('td',{}, pct===null ? '-' : el('span',{style:'font-weight:800;color:'+(pct>100?'var(--danger)':'var(--ok)')+';'}, pct+'%')),
    ));
  });
  panel.appendChild(allocTbl);
  panel.appendChild(el('button',{class:'btn btn-primary', style:'width:auto;padding:9px 18px;margin-top:10px;', onclick: async ()=>{
    const alloc = {};
    let sum = 0;
    wardKeys.forEach(w=>{ const v = Number(allocInputs[w].value)||0; alloc[w]=v; sum+=v; });
    if(govtTotal && sum > govtTotal){ showToast(t('overAllocatedWarn')); }
    const existing = (await safeGet('wardAllocation:'+STATE.user.coopId, true)) || {};
    existing[STATE.currentFiscalYear] = alloc;
    await safeSet('wardAllocation:'+STATE.user.coopId, existing, true);
    STATE.wardAllocData.alloc = alloc;
    showToast(t('wardAllocSaved'));
    render();
  }}, '💾 ' + t('wardAllocSave')));

  // वास्तविक बिक्री/अनुदान रिपोर्ट (bottom-up, already-recorded data)
  panel.appendChild(el('h3',{style:'font-size:14px;margin:22px 0 4px;'}, '📊 ' + t('wardReport')));
  const tbl = el('table',{},
    el('tr',{}, el('th',{},t('wardCol')), el('th',{},t('wardFarmersCol')), el('th',{},t('wardQuotaCol')), el('th',{},t('wardSoldCol')), el('th',{},t('wardSubsidyCol')))
  );
  wardKeys.forEach(w=>{
    const d = byWard[w];
    tbl.appendChild(el('tr',{},
      el('td',{}, el('span',{class:'badge badge-subsidy'}, t('wardNoShort')+' '+w)),
      el('td',{}, d.farmers),
      el('td',{}, d.quotaBags.toLocaleString()),
      el('td',{}, fmtMoney(d.sold)),
      el('td',{}, fmtMoney(d.subsidy)),
    ));
  });
  panel.appendChild(tbl);
  wrap.appendChild(panel);
  return wrap;
}

}

/* ===================== नाफा-नोक्सान रिपोर्ट (Profit & Loss) ===================== */
function ProfitLossView(){
  const wrap = el('div',{class:'content'});
  const panel = el('div',{class:'panel'});
  panel.appendChild(el('h2',{}, t('profitLossTitle')+' ('+STATE.currentFiscalYear+')'));
  panel.appendChild(el('div',{class:'desc'}, t('profitLossDesc')));

  const fyPurchases = STATE.purchases.filter(p=>(p.fiscalYear||STATE.currentFiscalYear)===STATE.currentFiscalYear);
  const fySales = STATE.sales.filter(s=>!s.voided && (s.fiscalYear||STATE.currentFiscalYear)===STATE.currentFiscalYear);

  const totalRevenue = fySales.reduce((s,x)=>s+Number(x.total||0),0);
  const totalTransport = fyPurchases.reduce((s,p)=>s+Number(p.transportCost||0),0);
  const totalCost = fyPurchases.reduce((s,p)=>s+Number(p.total||0),0); // already includes transportCost, see PurchaseView
  const netPL = totalRevenue - totalCost;

  panel.appendChild(el('div',{class:'grid3', style:'margin-bottom:16px;'},
    el('div',{class:'stat'}, el('span',{class:'tag'},'📤'), el('div',{class:'n'}, fmtMoney(totalRevenue)), el('div',{class:'l'}, t('totalRevenueCol'))),
    el('div',{class:'stat'}, el('span',{class:'tag'},'📥'), el('div',{class:'n'}, fmtMoney(totalCost)), el('div',{class:'l'}, t('totalCostCol'))),
    el('div',{class:'stat'}, el('span',{class:'tag'},'🚚'), el('div',{class:'n'}, fmtMoney(totalTransport)), el('div',{class:'l'}, t('transportTotalCol'))),
  ));

  panel.appendChild(el('div',{style:'padding:18px;border-radius:12px;background:'+(netPL>=0?'#E4F1E6':'#FBEAE8')+';text-align:center;'},
    el('div',{style:'font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;'}, t('netProfitCol')),
    el('div',{style:'font-size:26px;font-weight:800;color:'+(netPL>=0?'var(--ok)':'var(--danger)')+';'}, (netPL>=0?'+':'')+fmtMoney(netPL)),
    el('div',{style:'font-weight:700;margin-top:4px;color:'+(netPL>=0?'var(--ok)':'var(--danger)')+';'}, netPL>=0 ? t('profitLabel') : t('lossLabel')),
  ));

  wrap.appendChild(panel);
  return wrap;
}

/* ===================== ID CARD VIEW ===================== */
let selectedCardIds = new Set();

function makeIdCard(f){
  const card = el('div',{class:'idcard'});
  card.appendChild(el('div',{class:'strip'}));
  card.appendChild(el('div',{class:'hd'},
    el('div',{class:'m'},'🌾'),
    el('div',{class:'t'}, t('cardOrgLine')+'\n'+f.coopName)
  ));
  const photoBox = el('div',{class:'photo'});
  if(f.docs && f.docs.farmerPhoto) photoBox.appendChild(el('img',{src:f.docs.farmerPhoto.dataUrl}));
  const info = el('div',{class:'info'},
    el('b',{}, f.name),
    el('div',{class:'id'}, f.id),
    el('div',{class:'addr'}, (STATE.lang!=='en'?'ठेगाना: ':'Addr: ')+(f.address||'-')+(f.wardNo?(' — '+t('wardNoShort')+' '+f.wardNo):'')),
    el('div',{}, t('ph')+': '+(f.phone||'-')),
  );
  const body = el('div',{class:'body'}, photoBox, info);
  card.appendChild(body);

  const codesRow = el('div',{class:'codesrow'});
  const bcWrap = el('div',{class:'bcwrap'});
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  bcWrap.appendChild(svg);
  const qrWrap = el('div',{class:'qrwrap'});
  codesRow.appendChild(bcWrap);
  codesRow.appendChild(qrWrap);
  card.appendChild(codesRow);

  card.appendChild(el('div',{class:'sigrow'},
    el('div',{class:'sigbox'}, el('div',{class:'line'}), el('div',{class:'lbl'}, t('signature')))
  ));
  setTimeout(()=>{
    try{
      JsBarcode(svg, f.id, {format:'CODE128', displayValue:true, fontSize:9, height:26, margin:0});
    }catch(e){}
    try{
      if(typeof QRCode !== 'undefined'){
        // QR encodes the farmer ID so a phone scan looks the farmer up the same
        // way manual ID entry does in the Sale screen.
        new QRCode(qrWrap, {text: f.id, width:44, height:44, correctLevel: QRCode.CorrectLevel.M});
      }
    }catch(e){}
  },0);
  return card;
}

function IdCardsView(){
  const wrap = el('div',{class:'content'});
  const panel = el('div',{class:'panel'});
  panel.appendChild(el('h2',{}, t('idTitle')));
  panel.appendChild(el('div',{class:'desc'}, t('idDesc')));

  if(STATE.farmers.length===0){
    panel.appendChild(el('div',{class:'empty'}, el('div',{class:'ic'},'🪪'), t('noData')));
    wrap.appendChild(panel);
    return wrap;
  }

  const controls = el('div',{style:'display:flex;gap:10px;margin-bottom:14px;'},
    el('button',{class:'btn btn-outline', onclick:()=>{
      if(selectedCardIds.size === STATE.farmers.length){ selectedCardIds.clear(); }
      else { STATE.farmers.forEach(f=>selectedCardIds.add(f.id)); }
      render();
    }}, t('selectAll')),
    el('button',{class:'btn btn-gold', onclick:()=>window.print()}, '🖨️ ' + t('printSelected')),
  );
  panel.appendChild(controls);

  const grid = el('div',{style:'display:flex;flex-wrap:wrap;gap:14px;'});
  STATE.farmers.forEach(f=>{
    const checked = selectedCardIds.has(f.id);
    const cell = el('label',{style:'display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;'});
    const cb = el('input',{type:'checkbox', checked: checked?'checked':null, onchange:(e)=>{
      if(e.target.checked) selectedCardIds.add(f.id); else selectedCardIds.delete(f.id);
    }});
    cell.appendChild(el('div',{}, cb, ' ', f.name));
    cell.appendChild(makeIdCard(f));
    grid.appendChild(cell);
  });
  panel.appendChild(grid);
  wrap.appendChild(panel);

  // print sheet: 6 per A4
  const printSheet = el('div',{id:'printArea'});
  const sheet = el('div',{class:'a4sheet'});
  const toPrint = STATE.farmers.filter(f=>selectedCardIds.size===0 || selectedCardIds.has(f.id));
  toPrint.forEach(f=> sheet.appendChild(makeIdCard(f)));
  printSheet.appendChild(sheet);
  wrap.appendChild(printSheet);

  return wrap;
}

/* ===================== राष्ट्रिय सरकारी ड्यासबोर्ड (सबै पालिका एकैचोटि) =====================
   Reads across EVERY registered cooperative/municipality's tenant-scoped data
   (normally isolated per coopId) and rolls it into one nationwide picture —
   this is the piece a real Ministry of Agriculture oversight view would need. */
const GOVT_ACCESS_CODE = 'NEPAL-KRISHI-2082'; // demo-only access code, see govtNote in the UI

async function loadNationalAggregate(){
  const entries = Object.entries(STATE.usersCache||{});
  const fyData = await safeGet('fiscalYearData', true);
  const currentFy = (fyData && fyData.current) || '';
  const results = await Promise.all(entries.map(async ([uname, rec])=>{
    const [farmers, purchases, sales, govtQuota] = await Promise.all([
      safeGet('farmers:'+rec.coopId, true), safeGet('purchases:'+rec.coopId, true), safeGet('sales:'+rec.coopId, true),
      safeGet('govtAllocation:'+rec.coopId, true)
    ]);
    return {coopId: rec.coopId, coopName: rec.coopName, farmers: farmers||[], purchases: purchases||[], sales: sales||[], govtQuota: (govtQuota && govtQuota[currentFy]) || 0};
  }));
  return {results, currentFy};
}

/* ===================== किसान आफ्नो स्थिति स्व-सेवा (STATUS CHECK) =====================
   Public, no-login lookup by citizenship number or Farmer ID. Uses the same
   national registry as the duplicate-check feature to find which palika a
   farmer belongs to, then pulls that palika's own quota/sale records —
   the closest a static web app can get to an SMS/USSD self-check kiosk. */
let statusQuery = '';

async function doStatusSearch(){
  const query = statusQuery.trim();
  if(!query) return;
  STATE.publicStatus = {step:'searching'};
  render();

  let coopId = null;
  const natRec = await safeGet(natRegKey(query), true);
  if(natRec) coopId = natRec.coopId;

  let farmer = null, coopName = null;
  const entries = Object.entries(STATE.usersCache||{});
  if(coopId){
    const farmers = (await safeGet('farmers:'+coopId, true)) || [];
    farmer = farmers.find(f=>f.id===query) || farmers.find(f=>f.citizenshipNo && f.citizenshipNo.replace(/\s+/g,'')===query.replace(/\s+/g,''));
    const rec = entries.find(([u,r])=>r.coopId===coopId);
    coopName = rec ? rec[1].coopName : (farmer?farmer.coopName:null);
  }
  if(!farmer){
    // fallback nationwide scan (covers farmers registered before this feature / edge cases)
    for(const [uname, rec] of entries){
      const farmers = (await safeGet('farmers:'+rec.coopId, true)) || [];
      const match = farmers.find(f=>f.id===query || (f.citizenshipNo && f.citizenshipNo.replace(/\s+/g,'')===query.replace(/\s+/g,'')));
      if(match){ farmer = match; coopId = rec.coopId; coopName = rec.coopName; break; }
    }
  }
  if(!farmer){
    STATE.publicStatus = {step:'result', notFound:true};
    render();
    return;
  }

  const [sales, fyData] = await Promise.all([
    safeGet('sales:'+coopId, true), safeGet('fiscalYearData', true)
  ]);
  const currentFy = (fyData && fyData.current) || '';
  const needsThisFy = (farmer.annualNeeds||[]).filter(n=>(n.fiscalYear||currentFy)===currentFy);
  const farmerSales = (sales||[]).filter(s=>s.farmerId===farmer.id && !s.voided);
  const usedByItem = {};
  farmerSales.forEach(s=>{
    getSaleItems(s).forEach(it=>{
      usedByItem[it.itemName] = (usedByItem[it.itemName]||0) + (Number(it.qty)||0);
    });
  });
  const subsidyTotal = farmerSales.filter(s=>s.subsidy).reduce((sum,s)=>sum+Number(s.subsidyAmount||0),0);

  STATE.publicStatus = {step:'result', notFound:false, farmer, coopName, needsThisFy, usedByItem, subsidyTotal, currentFy};
  render();
}

      list.push({
        id: genId('GN'),
        name: complaintForm.name.trim(), phone: complaintForm.phone.trim(), text: complaintForm.text.trim(),
        status: 'pending', submittedAt: new Date().toISOString(),
      });
      await safeSet('complaints:'+pc.coopId, list, true);
      STATE.publicComplaint = {step:'done', coopId: pc.coopId, coopName: pc.coopName};
      render();
    }}, t('complaintSubmitBtn')));

    card.appendChild(el('div',{style:'text-align:center;margin-top:14px;'},
      el('button',{class:'btn btn-outline', style:'width:100%;', onclick:()=>{ STATE.publicComplaint={step:'pickCoop'}; render(); }}, t('selfRegBackToCoopList'))
    ));
  } else if(pc.step === 'done'){
    card.appendChild(el('div',{class:'small-note', style:'background:#E4F1E6;border-color:#CBE4CE;font-size:13px;padding:14px;'}, t('complaintSuccessMsg')));
    card.appendChild(el('button',{class:'btn btn-primary', style:'margin-top:14px;', onclick:()=>{
      STATE.publicComplaint = {step:'form', coopId: pc.coopId, coopName: pc.coopName};
      resetComplaintForm();
      render();
    }}, t('complaintAnother')));
  }

  wrap.appendChild(card);
  return wrap;
}

function render(){
  root.innerHTML='';
  if(STATE.publicRegister){
    root.appendChild(SelfRegisterView());
    if(STATE.toast) root.appendChild(el('div',{class:'toast'}, STATE.toast));
    return;
  }
  if(STATE.publicGovt){
    root.appendChild(GovtDashboardView());
    if(STATE.toast) root.appendChild(el('div',{class:'toast'}, STATE.toast));
    return;
  }
  if(STATE.publicStatus){
    root.appendChild(StatusCheckView());
    if(STATE.toast) root.appendChild(el('div',{class:'toast'}, STATE.toast));
    return;
  }
  if(STATE.publicComplaint){
    root.appendChild(ComplaintPublicView());
    if(STATE.toast) root.appendChild(el('div',{class:'toast'}, STATE.toast));
    return;
  }
  if(STATE.loading){
    root.appendChild(el('div',{class:'login-wrap'}, el('div',{class:'spinner', style:'width:26px;height:26px;border-color:rgba(47,82,51,0.25);border-top-color:var(--forest);'})));
    return;
  }
  if(!STATE.loggedIn){
    root.appendChild(LoginView());
  } else {
    const app = el('div',{class:'app'});
    app.appendChild(Sidebar());
    const main = el('div',{class:'main'});
    const titles = {
      dashboard:[t('dashboard'), STATE.user.coopName],
      monitoring:[t('monitoring'), STATE.user.coopName],
      farmers:[t('farmers'), null],
      products:[t('products'), null],
      purchase:[t('purchase'), null],
      sale:[t('sale'), null],
      subsidyReport:[t('subsidyReport'), null],
      profitLoss:[t('profitLossTab'), null],
      wardReport:[t('wardReport'), null],
      approvals:[t('approvals'), STATE.pendingFarmers.length ? (t('pendingCount')+': '+STATE.pendingFarmers.length) : null],
      complaints:[t('complaintsTab'), null],
      settings:[t('settingsTab'), null],
      idcards:[t('idcards'), null],
      fiscalYears:[t('fiscalYears'), null],
    };
    const [ttl, sub] = titles[STATE.tab];
    main.appendChild(Topbar(ttl, sub));
    if(!STATE.isOnline || offlineQueue.length>0){
      main.appendChild(el('div',{style:'background:#FFF4E5;border-bottom:1px solid #F0D9A8;padding:10px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;'},
        el('div',{style:'font-size:12.5px;'},
          el('span',{style:'font-weight:800;'}, STATE.isOnline ? ('🔄 '+t('pendingSyncCount')+': '+offlineQueue.length) : t('offlineBannerTitle')),
          el('div',{style:'color:var(--ink-soft);margin-top:2px;'}, STATE.isOnline ? t('offlineDataWarnNote') : t('offlineBannerDesc')),
        ),
        offlineQueue.length>0 ? el('button',{class:'btn btn-outline', type:'button', style:'width:auto;padding:7px 14px;font-size:12px;', onclick: ()=> syncOfflineQueue()}, t('syncNowBtn')) : null,
      ));
    }
    let view;
    if(STATE.tab==='dashboard') view = DashboardView();
    else if(STATE.tab==='monitoring') view = MonitoringView();
    else if(STATE.tab==='farmers') view = FarmersView();
    else if(STATE.tab==='products') view = ProductsView();
    else if(STATE.tab==='purchase') view = PurchaseView();
    else if(STATE.tab==='sale') view = SaleView();
    else if(STATE.tab==='subsidyReport') view = ReportView();
    else if(STATE.tab==='profitLoss') view = ProfitLossView();
    else if(STATE.tab==='wardReport') view = WardReportView();
    else if(STATE.tab==='approvals') view = ApprovalsView();
    else if(STATE.tab==='complaints') view = ComplaintsView();
    else if(STATE.tab==='settings') view = SettingsView();
    else if(STATE.tab==='idcards') view = IdCardsView();
    else if(STATE.tab==='fiscalYears') view = FiscalYearsView();
    main.appendChild(view);
    app.appendChild(main);
    root.appendChild(app);
    if(STATE.helpOpen) root.appendChild(HelpModal());
    startClock();
  }
  if(STATE.toast){
    root.appendChild(el('div',{class:'toast'}, STATE.toast));
  }
}

(async function init(){
  // सार्वजनिक प्रवेशद्वारहरू: login नगरिकनै सोझै खुल्ने विशेष लिंकहरू —
  //  #register[?coop=ID]  → किसान सेल्फ-दर्ता फारम
  //  #govt                → राष्ट्रिय सरकारी ड्यासबोर्ड (सबै पालिका एकैचोटि, पहुँच-कोड सुरक्षित)
  //  #status               → किसानको आफ्नो कोटा/स्थिति स्व-सेवा खोजी (SMS/USSD-शैली, हाल वेबमा)
  const hashBase = location.hash.split('?')[0];
  if(hashBase === '#register'){
    const q = location.hash.split('?')[1] || '';
    const params = new URLSearchParams(q);
    const coopIdParam = params.get('coop');
    STATE.usersCache = (await safeGet('users', true)) || {};
    STATE.loading = false;
    if(coopIdParam){
      const entry = Object.entries(STATE.usersCache).find(([u,r])=>r.coopId===coopIdParam);
      STATE.publicRegister = entry ? {step:'form', coopId: entry[1].coopId, coopName: entry[1].coopName} : {step:'pickCoop'};
    } else {
      STATE.publicRegister = {step:'pickCoop'};
    }
    render();
    return;
  }
  if(hashBase === '#govt'){
    const [users, cropFormula] = await Promise.all([safeGet('users', true), safeGet('cropFormulaConfig', true)]);
    STATE.usersCache = users || {};
    STATE.cropFormula = cropFormula || JSON.parse(JSON.stringify(CROP_QUOTA_FORMULA_DEFAULT));
    STATE.loading = false;
    STATE.publicGovt = {step:'gate', code:''};
    render();
    return;
  }
  if(hashBase === '#status'){
    STATE.loading = false;
    STATE.publicStatus = {step:'search'};
    render();
    return;
  }
  if(hashBase === '#complaint'){
    const q = location.hash.split('?')[1] || '';
    const params = new URLSearchParams(q);
    const coopIdParam = params.get('coop');
    STATE.usersCache = (await safeGet('users', true)) || {};
    STATE.loading = false;
    if(coopIdParam){
      const entry = Object.entries(STATE.usersCache).find(([u,r])=>r.coopId===coopIdParam);
      STATE.publicComplaint = entry ? {step:'form', coopId: entry[1].coopId, coopName: entry[1].coopName} : {step:'pickCoop'};
    } else {
      STATE.publicComplaint = {step:'pickCoop'};
    }
    render();
    return;
  }
  await loadAll();
  render();
})();
</script>
